# Fallback project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
#
# CookieCutter.xcodeproj is checked in, so you do not need this — it is here so
# the project can be regenerated from scratch:
#
#   brew install xcodegen && xcodegen generate
#
# Keep the two in sync when you add targets or change build settings.
name: CookieCutter
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CookieCutter:
    type: application
    platform: iOS
    sources:
      - path: CookieCutter
    dependencies:
      - target: CookieCutterStickers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CookieCutter
        INFOPLIST_FILE: CookieCutter/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: CookieCutter/CookieCutter.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"

  CookieCutterStickers:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: CookieCutterStickers
      # Shared with the app: the extension reads the same library.
      - path: CookieCutter/Models/Sticker.swift
      - path: CookieCutter/Models/AppGroup.swift
      - path: CookieCutter/Models/StickerStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CookieCutter.Stickers
        INFOPLIST_FILE: CookieCutterStickers/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: CookieCutterStickers/CookieCutterStickers.entitlements
        SKIP_INSTALL: "YES"
