/* ========================================================== HELPERS ==== */
const rint=x=>Math.round(x);
const rnd=(a,b)=>a+Math.random()*(b-a);
const variance=()=>rnd(.92,1.08);
function gearStats(avg){const o={};for(const k in GEAR_PER_ILVL)o[k]=GEAR_PER_ILVL[k]*avg;return o;}
function avgIlvl(g){const v=Object.values(g);return v.reduce((a,b)=>a+b,0)/v.length;}
function living(a){return a.filter(x=>x&&x.alive);}

/* ========================================================= COMBATANT === */
class Combatant{
  constructor(name,role,klass,isEnemy=false){
    this.name=name; this.role=role; this.klass=klass; this.isEnemy=isEnemy; this.isPlayer=false;
    this.maxhp=1; this.hp=1; this.power=0; this.crit=0; this.haste=0; this.defense=0;
    this.restype=klass?klass.res:"NONE"; this.maxres=klass?klass.maxres:0;
    this.res=this.maxres; this.regen=klass?klass.regen:0;
    this.cd={}; this.fx=[]; this.threat=0; this.alive=true;
  }
  applyStats(base,gear){
    this.maxhp=rint(base.hp+gear.hp); this.hp=this.maxhp;
    this.power=base.power+gear.power;
    this.crit=Math.min(.75,base.crit+gear.crit);
    this.haste=Math.min(.60,base.haste+gear.haste);
    this.defense=Math.min(.80,base.defense+gear.defense);
  }
  addFx(f){this.fx=this.fx.filter(e=>e.name!==f.name); this.fx.push(f);}
  drFrac(){let f=this.defense; for(const e of this.fx) if(e.etype==="dr") f=1-(1-f)*(1-e.value); return Math.min(.90,f);}
  powerMult(){let m=1; for(const e of this.fx) if(e.etype==="power") m+=e.value; return m;}
  hpPct(){return this.maxhp<=0?0:this.hp/this.maxhp;}
  takeDamage(amt,mit=true){
    if(!this.alive)return 0;
    if(mit)amt*=1-this.drFrac();
    amt=rint(amt);
    for(const e of [...this.fx]){
      if(e.etype==="absorb"&&amt>0){const u=Math.min(e.value,amt);e.value-=u;amt-=u;if(e.value<=0)this.fx=this.fx.filter(x=>x!==e);}
    }
    this.hp-=amt; if(this.hp<=0){this.hp=0;this.alive=false;}
    return amt;
  }
  heal(amt){if(!this.alive)return 0;amt=rint(amt);const b=this.hp;this.hp=Math.min(this.maxhp,this.hp+amt);return this.hp-b;}
  gain(a){this.res=Math.min(this.maxres,this.res+a);}
  canAfford(s){return this.res>=s.cost && (this.cd[s.name]||0)<=0;}
  tickStart(){this.gain(this.regen); for(const k in this.cd) if(this.cd[k]>0) this.cd[k]--;}
  tickFx(){for(const e of [...this.fx]){
    if(e.etype==="dot"&&this.alive)this.takeDamage((e.src?e.src.power:100)*e.power,false);
    else if(e.etype==="hot"&&this.alive)this.heal((e.src?e.src.power:100)*e.power);
    e.dur--; if(e.dur<=0)this.fx=this.fx.filter(x=>x!==e);
  }}
}

function defaultSave(){const g={};GEAR_SLOTS.forEach(s=>g[s]=8);
  return {name:null,role:null,klass:null,gear:g,cleared:{Normal:[],Heroic:[],Mythic:[]},kills:0};}
function loadSave(){try{const s=JSON.parse(localStorage.getItem("textraid_save"));
  if(s){const b=defaultSave();Object.assign(b,s);GEAR_SLOTS.forEach(sl=>{if(b.gear[sl]==null)b.gear[sl]=8;});
    b.cleared=Object.assign({Normal:[],Heroic:[],Mythic:[]},b.cleared||{});return b;}}catch(e){}
  return defaultSave();}
function writeSave(){try{localStorage.setItem("textraid_save",JSON.stringify(SAVE));}catch(e){}}

/* ============================================ COMBAT BUILD / TARGETING == */
function makeCombatant(name,klass,ilvl,isPlayer=false){
  const c=new Combatant(name,klass.role,klass); c.applyStats(ROLE_BASE[klass.role],gearStats(ilvl));
  c.isPlayer=isPlayer; return c;
}
function buildRaid(role,klass,name,diff,gearAvg){
  const raid=[]; const names={TANK:[...BOT_NAMES.TANK],HEALER:[...BOT_NAMES.HEALER],DPS:[...BOT_NAMES.DPS]};
  const counts={}; RAID_COMP.forEach(r=>counts[r]=(counts[r]||0)+1);
  const cyc={TANK:0,HEALER:0,DPS:0}; let added=false;
  ["TANK","HEALER","DPS"].forEach(r=>{
    for(let i=0;i<(counts[r]||0);i++){
      if(r===role&&!added){raid.push(makeCombatant(name,klass,gearAvg,true));added=true;}
      else{const k=CLASSES[r][cyc[r]%CLASSES[r].length];cyc[r]++;
        const nm=names[r].length?names[r].shift():r+cyc[r]; raid.push(makeCombatant(nm,k,diff.bot));}
    }
  });
  return raid;
}
function primaryEnemy(){const la=living(G.adds); if(la.length)return la.reduce((m,a)=>a.hp<m.hp?a:m); return G.boss.alive?G.boss:null;}
function attackTarget(c){if(c.role==="TANK")return G.boss.alive?G.boss:primaryEnemy(); return primaryEnemy();}
function lowestAlly(ex){const p=living(G.raid).filter(a=>a!==ex); if(!p.length)return null; return p.reduce((m,a)=>a.hpPct()<m.hpPct()?a:m);}
function aggroTarget(){const b=G.boss; if(b.tauntT>0&&b.tauntBy&&b.tauntBy.alive)return b.tauntBy;
  const l=living(G.raid); if(!l.length)return null; return l.reduce((m,a)=>a.threat>m.threat?a:m);}
function addThreat(c,amt){c.threat+=amt*(c.role==="TANK"?2:1);}
function magnitude(c,mult){let a=c.power*mult*(1+c.haste*.25)*c.powerMult();const crit=Math.random()<c.crit;if(crit)a*=1.5;return [rint(a*variance()),crit];}

/* ============================================================ LOG ====== */
function log(html,cls){G.log.push(cls?`<span class="${cls}">${html}</span>`:html); if(G.log.length>120)G.log.shift();}
const cn=c=>`<span class="${c.role==='TANK'?'c-blue':c.role==='HEALER'?'c-green':'c-red'}">${c.name}</span>`;

/* ===================================================== SKILL RESOLUTION = */
function resolveSkill(c,s){
  if(s.cost)c.res-=s.cost; if(s.cd)c.cd[s.name]=s.cd;
  const k=s.kind;
  if(k==="attack"||k==="aoe_attack"){
    const targets= k==="aoe_attack"?[G.boss,...G.adds]:[attackTarget(c)];
    let total=0,crit=false;
    for(const t of living(targets)){const [a,cr]=magnitude(c,s.power);const d=t.takeDamage(a);total+=d;crit=crit||cr;addThreat(c,d*s.threat);}
    log(`${cn(c)} → <b>${s.name}</b> for <span class="c-red">${total}</span> dmg${crit?' <span class="c-yellow">CRIT!</span>':''}`);
  } else if(k==="dot"){
    const t=attackTarget(c); if(t){t.addFx({name:s.name,etype:"dot",value:0,dur:s.dur,src:c,power:s.power});
      addThreat(c,c.power*s.power*s.threat); log(`${cn(c)} afflicts <b>${s.name}</b> (${s.dur})`,"c-mag");}
  } else if(k==="heal"||k==="aoe_heal"){
    let targets= s.target==="self"?[c]: k==="aoe_heal"?living(G.raid):[lowestAlly()].filter(Boolean);
    let total=0,crit=false; for(const t of targets){const [a,cr]=magnitude(c,s.power);total+=t.heal(a);crit=crit||cr;}
    addThreat(c,total*.15);
    const who= k==="aoe_heal"?"the raid": s.target==="self"?"self":(targets[0]?targets[0].name:"—");
    log(`${cn(c)} → <b>${s.name}</b> on ${who}: <span class="c-green">${total}</span> heal${crit?' <span class="c-yellow">CRIT!</span>':''}`);
  } else if(k==="hot"){
    const t= s.target==="self"?c:lowestAlly(); if(t){t.addFx({name:s.name,etype:"hot",value:0,dur:s.dur,src:c,power:s.power});
      log(`${cn(c)} applies <b>${s.name}</b> to ${t.name} (${s.dur})`,"c-green");}
  } else if(k==="shield"||k==="aoe_shield"){
    const targets= k==="aoe_shield"?living(G.raid):[lowestAlly()].filter(Boolean);
    for(const t of targets){const pool=rint(c.power*s.power); if(s.name==="Diagnosis")t.heal(rint(c.power*.8));
      t.addFx({name:s.name,etype:"absorb",value:pool,dur:s.dur,src:c});}
    const who= k==="aoe_shield"?"the raid":(targets[0]?targets[0].name:"—");
    log(`${cn(c)} shields ${who} with <b>${s.name}</b>`,"c-blue");
  } else if(k==="taunt"){
    G.boss.tauntBy=c; G.boss.tauntT=2; c.threat=Math.max(0,...living(G.raid).map(a=>a.threat))*1.5+200;
    log(`${cn(c)} <b>${s.name}</b>s — the boss turns!`,"c-blue");
  } else if(k==="defensive"){
    c.addFx({name:s.name,etype:"dr",value:s.value,dur:s.dur}); log(`${cn(c)} braces with <b>${s.name}</b> (-${rint(s.value*100)}% dmg)`,"c-blue");
  } else if(k==="buff"){
    c.addFx({name:s.name,etype:"power",value:s.value,dur:s.dur}); log(`${cn(c)} empowers <b>${s.name}</b> (+${rint(s.value*100)}% dmg)`,"c-yellow");
  }
}
function basicAttack(c){const t=attackTarget(c); if(!t)return; const [a,cr]=magnitude(c,.85); const d=t.takeDamage(a);
  addThreat(c,d); if(["RAGE","ENERGY","FOCUS"].includes(c.restype))c.gain(15);
  log(`${cn(c)} attacks for <span class="c-red">${d}</span>${cr?' <span class="c-yellow">CRIT!</span>':''}`);}

/* ============================================================ BOT AI === */
function byKinds(klass,set){return klass.skills.filter(s=>set.includes(s.kind));}
function bestAfford(c,skills){const u=skills.filter(s=>c.canAfford(s)); if(!u.length)return null;
  return u.reduce((m,s)=>(s.power+s.value*3)>(m.power+m.value*3)?s:m);}
function botAction(actor,incoming,mt){
  const k=actor.klass; const la=living(G.adds);
  if(actor.role==="TANK"){
    const cur=aggroTarget();
    if(actor.hpPct()<.4){const h=bestAfford(actor,byKinds(k,["heal","hot"])); if(h){resolveSkill(actor,h);return;}}
    if(incoming&&(incoming.kind==="tank_buster"||incoming.kind==="cleave")&&cur===actor){
      const d=bestAfford(actor,byKinds(k,["defensive"])); if(d){resolveSkill(actor,d);return;}}
    if(actor===mt&&cur!==actor&&G.boss.tauntT<=0){const t=k.skills.find(s=>s.kind==="taunt"&&actor.canAfford(s)); if(t){resolveSkill(actor,t);return;}}
    const kinds= la.length?["aoe_attack","dot"]:["attack","dot"];
    const a=bestAfford(actor,byKinds(k,kinds)); if(a)resolveSkill(actor,a); else basicAttack(actor); return;
  }
  if(actor.role==="HEALER"){
    if(incoming&&incoming.kind==="raid_aoe"){const ao=bestAfford(actor,byKinds(k,["aoe_heal","aoe_shield"]));
      if(ao&&Math.min(...living(G.raid).map(a=>a.hpPct()))<.9){resolveSkill(actor,ao);return;}}
    const low=lowestAlly();
    if(low&&low.hpPct()<.45){const b=bestAfford(actor,byKinds(k,["heal"])); if(b){resolveSkill(actor,b);return;}}
    if(living(G.raid).filter(a=>a.hpPct()<.7).length>=4){const ao=bestAfford(actor,byKinds(k,["aoe_heal","aoe_shield"])); if(ao){resolveSkill(actor,ao);return;}}
    if(low&&low.hpPct()<.8){const h=bestAfford(actor,byKinds(k,["heal","hot","shield"])); if(h){resolveSkill(actor,h);return;}}
    const a=bestAfford(actor,byKinds(k,["attack","dot"])); if(a&&actor.res>actor.maxres*.4)resolveSkill(actor,a); else basicAttack(actor); return;
  }
  // DPS
  const buff=k.skills.find(s=>s.kind==="buff"&&actor.canAfford(s));
  if(buff&&!actor.fx.some(e=>e.etype==="power")){resolveSkill(actor,buff);return;}
  if(la.length>=2){const ao=bestAfford(actor,byKinds(k,["aoe_attack"])); if(ao){resolveSkill(actor,ao);return;}}
  const tgt=attackTarget(actor);
  const dot=k.skills.find(s=>s.kind==="dot"&&actor.canAfford(s));
  if(dot&&tgt&&!tgt.fx.some(e=>e.name===dot.name)){resolveSkill(actor,dot);return;}
  const a=bestAfford(actor,byKinds(k,["attack"])); if(a)resolveSkill(actor,a); else basicAttack(actor);
}

/* ===================================================== BOSS MECHANICS == */
function activeAbilities(){return G.boss.def.abilities.filter(ab=>!(ab.heroic&&!G.diff.extra));}
function bossDmgMult(){let m=G.diff.dmg; if(G.boss.enraged)m*=2.5; if(G.boss.phase===2)m*=1.15; return m;}
function resolveBossAbility(ab){
  const mult=bossDmgMult();
  if(ab.kind==="tank_buster"){const t=aggroTarget(); if(t){const d=t.takeDamage(ab.value*mult); log(`☠ <b>${ab.name}</b> smashes ${t.name} for ${d}!`,"c-red");}}
  else if(ab.kind==="cleave"){const t=aggroTarget(); const others=living(G.raid).filter(a=>a!==t);
    const vics=[t]; if(others.length)vics.push(others[rint(rnd(0,others.length-.5))]);
    vics.forEach(v=>{if(v)v.takeDamage(ab.value*mult);}); log(`☠ <b>${ab.name}</b> cleaves the front line!`,"c-red");}
  else if(ab.kind==="raid_aoe"){let tot=0; living(G.raid).forEach(a=>tot+=a.takeDamage(ab.value*mult)); log(`☠ <b>${ab.name}</b> hits the raid for ${tot}!`,"c-red");}
  else if(ab.kind==="spawn_adds"){const sc=Math.sqrt(G.diff.hp);
    for(let i=0;i<ab.addcount;i++){const a=new Combatant(ab.name.split(" ").pop()+" #"+(G.adds.length+1),"ADD",null,true);
      a.maxhp=a.hp=rint(ab.addhp*sc); a.hit=ab.addhit*G.diff.dmg; a.restype="NONE"; G.adds.push(a);}
    log(`☠ <b>${ab.name}</b> — ${ab.addcount} adds appear!`,"c-yellow");}
}

/* ========================================================= ENCOUNTER === */
function startEncounter(bossIndex){
  const def=BOSSES[bossIndex];
  const boss=new Combatant(def.name,"BOSS",null,true);
  boss.def=def; boss.maxhp=boss.hp=rint(def.hp*G.diff.hp);
  boss.autohit=def.autohit*G.diff.dmg; boss.enrage=def.enrage; boss.enraged=false;
  boss.phase=1; boss.tauntBy=null; boss.tauntT=0; boss.pending=null; boss.timers={};
  boss.defense=0;
  G.boss=boss; G.adds=[]; G.bossIndex=bossIndex; G.round=0;
  activeAbilities().forEach(ab=>boss.timers[ab.name]=ab.every);
  G.raid.forEach(c=>{c.hp=c.maxhp;c.res=c.maxres;c.fx=[];c.cd={};c.alive=true;c.threat=c.role==="TANK"?600:0;});
  G.mt=G.raid.find(c=>c.role==="TANK")||G.raid[0];
  G.log=[]; log(`<span class="c-dim">${def.intro}</span>`);
  startRound();
}
function startRound(){
  G.round++; G.raid.forEach(c=>c.tickStart());
  G.incoming=G.boss.pending;
  PHASE="combat"; render();
}
function playerAct(action){
  const p=G.player;
  if(p.alive){
    if(action==="auto")botAction(p,G.incoming,G.mt);
    else if(action==="basic")basicAttack(p);
    else if(action==="wait"){p.gain(p.regen); log(`${cn(p)} waits, recovering.`,"c-dim");}
    else if(typeof action==="number"){resolveSkill(p,p.klass.skills[action]);}
  }
  // remaining raid bots
  for(const a of G.raid){ if(a===p||!a.alive||!G.boss.alive)continue; botAction(a,G.incoming,G.mt); if(!G.boss.alive)break; }
  G.adds=G.adds.filter(a=>a.alive);
  if(!G.boss.alive){return endEncounter(true);}
  // boss turn
  log(`<span class="c-dim">── the boss acts ──</span>`);
  if(G.boss.pending){resolveBossAbility(G.boss.pending);G.boss.pending=null;}
  const tgt=aggroTarget();
  if(tgt){const d=tgt.takeDamage(G.boss.autohit*(G.boss.enraged?2.5:1)*(G.boss.phase===2?1.15:1));
    log(`${G.boss.name} strikes ${tgt.name} for <span class="c-red">${d}</span>.`);}
  for(const a of living(G.adds)){const at=aggroTarget(); if(at)at.takeDamage(a.hit||200);}
  if(living(G.adds).length)log(`<span class="c-yellow">Adds batter the raid!</span>`);
  [...G.raid,G.boss,...G.adds].forEach(c=>c.tickFx());
  if(!G.boss.alive)return endEncounter(true);
  const def=G.boss.def;
  if(def.phase2&&G.boss.phase===1&&G.boss.hpPct()<=def.phase2){G.boss.phase=2; log(`✦✦ ${def.phase2speech}`,"c-mag");}
  activeAbilities().forEach(ab=>{G.boss.timers[ab.name]--; if(G.boss.timers[ab.name]<=0&&G.boss.pending==null){G.boss.pending=ab;G.boss.timers[ab.name]=ab.every;}});
  if(G.boss.tauntT>0)G.boss.tauntT--;
  if(!G.boss.enraged&&G.round>=G.boss.enrage){G.boss.enraged=true; log(`⚠⚠ ${G.boss.name} ENRAGES! Burn it down or fall!`,"c-yellow");}
  if(!living(G.raid).length){return endEncounter(false);}
  startRound();
}
function endEncounter(victory){
  PHASE="bossresult";
  if(victory){
    const def=G.boss.def;
    if(!SAVE.cleared[G.diff.name].includes(def.name))SAVE.cleared[G.diff.name].push(def.name);
    SAVE.kills++; G.loot=awardLoot(G.bossIndex); writeSave();
  }
  G.victory=victory; render();
}
function awardLoot(idx){
  const base=G.diff.loot+idx*2; const drop=base+rint(rnd(0,4)); const slot=GEAR_SLOTS[rint(rnd(0,GEAR_SLOTS.length-.5))];
  const cur=SAVE.gear[slot];
  if(drop>cur){SAVE.gear[slot]=drop; return {slot,from:cur,to:drop,upgrade:true};}
  return {slot,drop,upgrade:false};
}

/* ============================================================ RENDER === */
const app=()=>document.getElementById("app");
function el(html){const d=document.createElement("div"); d.innerHTML=html; return d;}
function on(id,fn){const e=document.getElementById(id); if(e)e.onclick=fn;}

function hpBar(cur,mx,color){
  const f=Math.max(0,Math.min(100,mx<=0?0:cur/mx*100));
  const c=color||(f>50?'var(--green)':f>25?'var(--yellow)':'var(--red)');
  return `<div class="hpwrap"><div class="hpfill" style="width:${f}%;background:${c}"></div>
    <div class="hptext">${Math.max(0,rint(cur))} / ${rint(mx)}</div></div>`;
}
function fxIcons(c){const m={dr:"🛡",absorb:"◊",hot:"✚",dot:"☠",power:"⚔"};
  return c.fx.map(e=>m[e.etype]||"•").join(" ");}

function render(){
  if(PHASE==="home")return renderHome();
  if(PHASE==="role")return renderRole();
  if(PHASE==="class")return renderClass();
  if(PHASE==="difficulty")return renderDifficulty();
  if(PHASE==="pre")return renderPre();
  if(PHASE==="combat")return renderCombat();
  if(PHASE==="bossresult")return renderBossResult();
  if(PHASE==="raidresult")return renderRaidResult();
}

  <div class="sub">${RAID_NAME}</div></div>`;}

  h+=`</div>`;
  // log
  h+=`<div id="log">${G.log.slice(-40).map(l=>`<div>${l}</div>`).join("")}</div>`;
  // actions
  h+=`<div class="actbar">`;
  const p=G.player;
  if(!p.alive){
    h+=`<div class="panel center small">💀 You have fallen — your raid fights on.</div>
      <button id="cont" class="primary">Continue ▶</button>`;
  } else {
    h+=`<div class="grid2">`;
    p.klass.skills.forEach((s,i)=>{
      const cd=p.cd[s.name]||0; const aff=p.res>=s.cost; const ready=cd<=0&&aff;
      const meta= cd>0?`CD ${cd}`: !aff?`need ${s.cost}`:(s.cost?`${s.cost}`:'free');
      h+=`<button class="skillbtn skill" data-i="${i}" ${ready?'':'disabled'}>
        <span class="meta">${meta}</span><div class="btn-title">${s.name}</div>
        <div class="btn-desc">${s.desc}</div></button>`;});
    h+=`</div><div class="grid2" style="margin-top:8px">
      <button id="basic">👊 Basic Attack<div class="btn-desc">free, builds resource</div></button>
      <button id="wait">⏳ Wait / Regen<div class="btn-desc">recover resource</div></button></div>`;
  }
  h+=`</div>`;
  app().innerHTML=h;
  const lg=document.getElementById("log"); if(lg)lg.scrollTop=lg.scrollHeight;
  document.querySelectorAll(".skill").forEach(btn=>{if(btn.disabled)return;btn.onclick=()=>playerAct(+btn.dataset.i);});
  on("basic",()=>playerAct("basic"));
  on("wait",()=>playerAct("wait"));
  on("cont",()=>playerAct(null));
}
function renderBossResult(){
  const v=G.victory; let h=titleBlock();
  if(v){
    h+=`<div class="banner win"><div class="h c-green">VICTORY</div>
      <div>${G.boss.name} falls!</div><div class="small dim">${living(G.raid).length}/10 raiders standing</div></div>`;
    const L=G.loot;
    h+=`<div class="panel center">`+ (L.upgrade
      ? `<span class="c-gold">✦ Looted <b>${L.slot}</b> (ilvl ${L.from} → ${L.to})! Equipped.</span>`
      : `<span class="dim">A ${L.slot} (ilvl ${L.drop}) drops, but yours is better.</span>`)
      +`<div class="small dim" style="margin-top:6px">Average item level: ${avgIlvl(SAVE.gear).toFixed(1)}</div></div>`;
    if(G.bossIndex<BOSSES.length-1){
      h+=`<button id="next" class="primary choice">⚔ Pull Boss ${G.bossIndex+2}</button>`;
    } else {
      // raid cleared
      G.raidCleared=true;
      h+=`<button id="next" class="primary choice">🏆 Finish Raid</button>`;
    }
  } else {
    h+=`<div class="banner lose"><div class="h c-red">WIPE</div>
      <div>${G.boss.name} stands at ${rint(G.boss.hpPct()*100)}% health.</div>
      <div class="small dim">Re-gear, re-strategise, try again.</div></div>
      <button id="retry" class="primary choice">↻ Retry this Boss</button>
      <button id="bail" class="choice">↩ Leave Raid</button>`;
  }
  app().innerHTML=h;
  on("next",()=>{ if(G.raidCleared){PHASE="raidresult";render();} else {
    // refresh player stats for any gear change, restore raid, advance
    G.player.applyStats(ROLE_BASE[G.player.klass.role],gearStats(avgIlvl(SAVE.gear)));
    startEncounter(G.bossIndex+1);} });
  on("retry",()=>{G.player.applyStats(ROLE_BASE[G.player.klass.role],gearStats(avgIlvl(SAVE.gear)));startEncounter(G.bossIndex);});
  on("bail",()=>{PHASE="home";render();});
}
function renderRaidResult(){
  let h=titleBlock()+`<div class="banner win"><div class="h c-gold">RAID CLEARED!</div>
    <div>${G.diff.name} ${RAID_NAME} complete!</div>
    <div class="small dim">All 4 bosses down · ${SAVE.kills} lifetime kills</div></div>`;
  const nxt={Normal:"Heroic",Heroic:"Mythic"}[G.diff.name];
  if(nxt && SAVE.cleared[G.diff.name].length>=4) h+=`<div class="panel center c-yellow">✦ ${nxt} difficulty unlocked!</div>`;
  h+=`<button id="again" class="primary choice">↻ Raid Again</button>
     <button id="home" class="choice">🏠 Home</button>`;
  app().innerHTML=h;
  on("again",()=>{PHASE="difficulty";render();});
  on("home",()=>{PHASE="home";render();});
}

/* ============================================================== BOOT === */
SAVE=loadSave(); G={tmp:{}};
PHASE="home"; render();
</script>
</body>
