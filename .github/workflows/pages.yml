name: Deploy to GitHub Pages

# Publishes the two browser games:
#   /         -> Text Raiding
#   /polyme/  -> PolyMe
#
# `configure-pages` with enablement:true turns Pages on the first time this
# runs, so there is nothing to click in Settings.

on:
  push:
    branches:
      - claude/text-raid-game-o1qbew
      - claude/ps1-lowpoly-character-generator-z0s8lu
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site
        run: |
          mkdir -p _site/polyme
          cp index.html _site/index.html
          cp polyme/index.html _site/polyme/index.html
          ls -lR _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
