<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blood Moor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Alegreya+Sans+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: full-bleed isometric canvas; D2-style HUD (globes in the corners, belt and skill strip at the bottom); touch puts the skill wheel under the right thumb. One dark look by design. */
:root{
  --void:#000; --stone:#15110e; --stone2:#221c16; --line:#5c4b33; --line2:#8a7350; --gold:#c7b377; --bone:#e8e2d2; --ash:#8f8676;
  --blood:#b01818; --magic:#7f86ff; --rare:#ffff64; --bad:#e04848; --ok:#9ccf6a;
  --disp:"Metamorphous","Palatino Linotype","Book Antiqua",Georgia,serif;
  --ui:"Alegreya Sans SC","Trebuchet MS",sans-serif;
  --text:"Alegreya Sans","Trebuchet MS",sans-serif;
  --cell:36px; --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--bone);overflow:hidden}
body{font-family:var(--text);font-size:15px;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;image-rendering:pixelated}
.globe canvas,.sk img,.bslot img,.gi img,.eq img,.skc img,#buffs img,.panel,#strip,.stoneBtn{image-rendering:pixelated;image-rendering:crisp-edges}
.globe canvas,.sk img,.bslot img,.gi img,.eq img,.skc img,#buffs img{image-rendering:pixelated}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#hud button{pointer-events:auto}
.stoneBtn{background:linear-gradient(180deg,rgba(42,35,27,.4),rgba(18,14,11,.7)),var(--stoneTex) 0 0/192px 192px,#120e0b;border:1px solid var(--line);box-shadow:inset 0 0 0 1px #000,inset 0 1px 0 rgba(255,230,180,.08)}

/* globes */
.globe{position:absolute;width:118px;height:118px;bottom:calc(8px + var(--sb));pointer-events:auto}
.globe canvas{width:100%;height:100%;display:block}
.globe span{position:absolute;left:50%;top:-20px;transform:translateX(-50%);font-family:var(--ui);font-size:13px;white-space:nowrap;text-shadow:0 1px 2px #000,0 0 4px #000;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .2s}
.globe:hover span,.touch .globe span{opacity:1}
#globeL{left:calc(10px + var(--sl))}
#globeR{right:calc(10px + var(--sr));pointer-events:none}
#lvlBadge{position:absolute;left:calc(118px + var(--sl));bottom:calc(14px + var(--sb));width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:15px;color:var(--gold);background:radial-gradient(circle at 40% 35%,#3a2e20,#0a0806);border:1px solid var(--line2)}
#ptsDot{position:absolute;left:calc(140px + var(--sl));bottom:calc(36px + var(--sb));width:10px;height:10px;border-radius:50%;background:#ffd34a;box-shadow:0 0 8px #ffb000}

/* bottom strip: belt + skills */
#strip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + var(--sb));display:flex;align-items:flex-end;gap:14px;padding:12px 12px 8px;background:linear-gradient(180deg,rgba(26,21,16,.35),rgba(8,6,5,.6)),var(--stoneTex) 0 0/192px 192px;border:1px solid var(--line);border-bottom:0;box-shadow:inset 0 0 0 1px #000}
#xpbar{position:absolute;left:8px;right:8px;top:4px;height:4px;background:#0a0806;border:1px solid #2a2218}
#xpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#8a6a20,#e8c860);width:0}
#belt{display:flex;gap:4px}
.bslot{position:relative;width:44px;height:44px;padding:0;background:rgba(0,0,0,.6);border:1px solid var(--line)}
.bslot img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.bslot .n{position:absolute;right:2px;top:0;font-family:var(--ui);font-size:12px;color:var(--bone);text-shadow:0 1px 2px #000}
.bslot .key,.sk .key{position:absolute;left:2px;bottom:0;font-family:var(--ui);font-size:11px;color:var(--ash);text-shadow:0 1px 2px #000;pointer-events:none}
#skillbar{display:flex;gap:4px;align-items:flex-end}
.sk{position:relative;width:50px;height:50px;padding:0;background:#000;border:1px solid var(--line2);touch-action:none}
.sk.main{width:56px;height:56px}
.sk img{width:100%;height:100%;display:block;pointer-events:none}
.sk.empty{border-style:dashed;opacity:.55}
.sk.nomana img{filter:saturate(.3) brightness(.45) sepia(.4) hue-rotate(190deg)}
.sk.oncd img{filter:brightness(.5)}
.sk.on{outline:2px solid var(--gold)}

/* top right: menu buttons + minimap */
#menubar{position:absolute;right:calc(12px + var(--sr));top:calc(10px + var(--st));display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:300px}
#menubar button{position:relative;width:42px;height:42px;padding:0;display:grid;place-items:center}
#menubar svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#menubar button.glow{border-color:#ffd34a;box-shadow:0 0 10px rgba(255,190,40,.6)}
#tpN{position:absolute;right:1px;bottom:0;font-family:var(--ui);font-size:11px;color:var(--bone)}
#areaName{position:absolute;right:calc(12px + var(--sr));font-family:var(--disp);font-size:13px;color:var(--gold);text-shadow:0 1px 3px #000;white-space:nowrap}

#target{position:absolute;left:50%;top:calc(10px + var(--st));transform:translateX(-50%);width:min(380px,56vw);text-align:center}
#target .tbar{position:relative;height:22px;background:rgba(0,0,0,.65);border:1px solid #3a2a20}
#target .tbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#8a1010,#4a0606)}
#target .tname{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--ui);font-size:15px;text-shadow:0 1px 2px #000;z-index:1;margin-top:1px}
#target .tmods{font-family:var(--ui);font-size:13px;color:var(--magic);text-shadow:0 1px 2px #000;min-height:4px}
#buffs{position:absolute;left:calc(12px + var(--sl));bottom:calc(140px + var(--sb));display:flex;gap:4px}
#buffs span{position:relative;width:28px;height:28px}
#buffs img{width:100%;height:100%;border:1px solid var(--line)}
#buffs i{position:absolute;right:-2px;bottom:-4px;font-style:normal;font-family:var(--ui);font-size:11px;text-shadow:0 1px 2px #000}
#msgs{position:absolute;left:calc(14px + var(--sl));bottom:calc(178px + var(--sb));display:flex;flex-direction:column;gap:2px;font-family:var(--ui);font-size:15px;text-shadow:0 1px 2px #000,0 0 6px #000;max-width:min(60vw,520px)}
#banner{position:absolute;left:0;right:0;top:22%;text-align:center;opacity:0;transition:opacity .8s;pointer-events:none}
#banner.show{opacity:1}
#banner b{display:block;font-family:var(--disp);font-weight:400;font-size:clamp(26px,5vw,46px);color:var(--gold);text-shadow:0 2px 6px #000,0 0 22px rgba(0,0,0,.9);letter-spacing:.04em}
#banner small{display:block;font-family:var(--ui);font-size:16px;color:var(--bone);text-shadow:0 1px 3px #000;margin-top:4px}
#joy{position:fixed;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;border:1.5px solid rgba(199,179,119,.45);background:radial-gradient(circle,rgba(0,0,0,.1),rgba(0,0,0,.45));pointer-events:none;z-index:3}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(232,226,210,.5),rgba(120,100,70,.35));border:1.5px solid rgba(232,226,210,.6)}

/* touch layout */
.touch .globe{width:76px;height:76px;top:calc(8px + var(--st));bottom:auto}
.touch #globeL{left:calc(8px + var(--sl))}
.touch #globeR{left:calc(88px + var(--sl));right:auto}
.touch .globe span{top:auto;bottom:-16px;font-size:12px}
.touch #lvlBadge{left:calc(168px + var(--sl));top:calc(30px + var(--st));bottom:auto}
.touch #ptsDot{left:calc(190px + var(--sl));top:calc(26px + var(--st));bottom:auto}
.touch #strip{background:none;border:0;box-shadow:none;padding:0;transform:none;left:calc(50% - 150px)}
.touch #xpbar{position:fixed;left:calc(8px + var(--sl));right:auto;width:160px;top:calc(104px + var(--st))}
.touch #skillbar{position:fixed;right:0;bottom:0;width:0;height:0}
.touch .sk{position:fixed;width:52px;height:52px;border-radius:50%;overflow:hidden;border-width:2px;box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.touch .sk.main{width:84px;height:84px;right:calc(18px + var(--sr));bottom:calc(18px + var(--sb))}
.touch .sk:nth-child(2){right:calc(174px + var(--sr));bottom:calc(34px + var(--sb))}
.touch .sk:nth-child(3){right:calc(163px + var(--sr));bottom:calc(88px + var(--sb))}
.touch .sk:nth-child(4){right:calc(133px + var(--sr));bottom:calc(133px + var(--sb))}
.touch .sk:nth-child(5){right:calc(88px + var(--sr));bottom:calc(163px + var(--sb))}
.touch .sk:nth-child(6){right:calc(34px + var(--sr));bottom:calc(174px + var(--sb))}
.touch .sk .key{display:none}
.touch .bslot{width:46px;height:46px;border-radius:6px}
.touch .bslot .key{display:none}
.touch #menubar{max-width:146px}
.touch #buffs{left:calc(10px + var(--sl));top:calc(116px + var(--st));bottom:auto}
.touch #msgs{top:calc(150px + var(--st));bottom:auto;font-size:14px;max-width:46vw}
.touch #target{width:min(300px,36vw);left:42%}
@media (max-width:640px){
  .touch #target{width:min(300px,60vw);left:50%;top:calc(120px + var(--st))}
  .touch #strip{left:calc(10px + var(--sl));transform:none;bottom:calc(240px + var(--sb))}
  .touch #belt{flex-direction:column}
}
@media (max-height:500px){ #banner{top:32%} #banner b{font-size:30px} #banner small{font-size:14px} }

/* panels */
.panel{position:fixed;z-index:6;top:calc(8px + var(--st));bottom:calc(8px + var(--sb));width:min(440px,calc(50vw - 16px));overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding:14px 14px 18px;box-sizing:border-box;
  background:linear-gradient(180deg,rgba(12,9,7,.55),rgba(6,5,4,.8)),var(--stoneTex) 0 0/192px 192px,#120e0b;border:1px solid var(--line2);box-shadow:inset 0 0 0 3px #000,inset 0 0 0 4px #3a2e20,0 10px 40px #000;display:flex;flex-direction:column;align-items:center;gap:10px}
#panelL{left:calc(8px + var(--sl))}
#panelR{right:calc(8px + var(--sr))}
@media (max-width:719px){
  .panel{left:calc(6px + var(--sl))!important;right:calc(6px + var(--sr))!important;width:auto}
  #panelL:not(.solo){bottom:50%}
  #panelR:not(.solo){top:calc(50% + 4px)}
}
.panel h2{margin:0;font-family:var(--disp);font-weight:400;font-size:22px;color:var(--gold);letter-spacing:.05em;text-align:center}
.panel h3{margin:6px 0 0;font-family:var(--disp);font-weight:400;font-size:17px;color:var(--gold)}
.panel .sub{margin:-6px 0 0;color:var(--ash);font-size:14px;text-align:center}
.panel .x{position:absolute;right:8px;top:6px;width:34px;height:34px;background:none;border:1px solid var(--line);color:var(--ash);font-size:20px;line-height:1}
.cmeta{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;text-align:center}
.cmeta small{display:block;font-family:var(--ui);color:var(--ash);font-size:12px}
.cmeta b{font-family:var(--ui);font-weight:500;font-variant-numeric:tabular-nums}
.stats,.derived{width:100%;display:flex;flex-direction:column;gap:3px}
.srow{display:grid;grid-template-columns:1fr 60px 36px;align-items:center;gap:8px;padding:5px 8px;background:rgba(0,0,0,.4);border:1px solid #2e251a}
.srow .sn{font-family:var(--ui);font-size:16px}
.srow b{font-family:var(--ui);font-size:17px;text-align:right;font-variant-numeric:tabular-nums}
.srow b.boost{color:var(--magic)}
.plus{width:32px;height:28px;padding:0;background:linear-gradient(#3a2e1a,#1a140c);border:1px solid #c9a24a;color:#ffd34a;font-size:18px;line-height:1}
.pts,.spts{font-family:var(--ui);color:var(--ash);text-align:center;font-size:15px}
.pts.on,.spts.on{color:#ffd34a}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:2px 8px;font-family:var(--ui);font-size:14px;border-bottom:1px solid rgba(92,75,51,.25)}
.rrow b{font-weight:500;font-variant-numeric:tabular-nums}
.rrow .fire{color:#ff8a5a}.rrow .cold{color:#8ab4ff}.rrow .light{color:#ffe36a}.rrow .neg{color:var(--bad)}
.doll{position:relative;flex:none}
.eq{position:absolute;padding:0;background:rgba(0,0,0,.5);border:1px solid #3a2e20;display:grid;place-items:center;overflow:hidden}
.eq span{font-family:var(--ui);font-size:10px;color:#5a5040;overflow:hidden;white-space:nowrap;max-width:100%}
.eq img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.eq img.ghost{opacity:.3}
.grid{position:relative;flex:none;background-color:rgba(0,0,0,.55);background-image:linear-gradient(rgba(92,75,51,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(92,75,51,.35) 1px,transparent 1px);background-size:var(--cell) var(--cell);border:1px solid var(--line)}
.gi{position:absolute;padding:0;border:0;background:rgba(40,50,40,.08)}
.gi img{width:100%;height:100%;display:block;pointer-events:none}
.gi.r-magic,.eq.r-magic{background:rgba(60,70,170,.22)}
.gi.r-rare,.eq.r-rare{background:rgba(160,160,40,.2)}
.gi.r-unique,.eq.r-unique{background:rgba(150,115,50,.28)}
.gi.bad,.eq.bad{background:rgba(170,20,20,.38)}
.gi:hover,.eq:hover{outline:1px solid var(--gold)}
.goldrow{display:flex;align-items:center;gap:6px;width:100%;font-family:var(--ui);font-variant-numeric:tabular-nums}
.goldrow .sp{flex:1}
.goldrow button{padding:4px 10px;background:linear-gradient(#2a221a,#120e0a);border:1px solid var(--line2);font-family:var(--ui)}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#a87a1a);border:1px solid #5a4010}
.tpc{color:#8fb0ff}
.tabs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.tabs button{padding:6px 10px;background:rgba(0,0,0,.4);border:1px solid var(--line);font-family:var(--ui);font-size:14px;color:var(--ash)}
.tabs button[aria-pressed=true]{color:var(--gold);border-color:var(--gold);background:rgba(90,70,30,.3)}
.tree{position:relative;flex:none;margin-left:22px}
.tree svg{position:absolute;inset:0;pointer-events:none}
.tree line{stroke:#8a7350;stroke-width:3;opacity:.6}
.tier{position:absolute;left:-26px;font-family:var(--ui);font-size:12px;color:#5a5040;width:20px;text-align:right}
.skc{position:absolute;padding:0;background:#000;border:2px solid #2e261c}
.skc img{width:100%;height:100%;display:block;filter:grayscale(.85) brightness(.5);pointer-events:none}
.skc.has img{filter:none}
.skc.can{border-color:#c9a24a;box-shadow:0 0 10px rgba(255,190,60,.45)}
.skc.sel{outline:2px solid var(--bone);outline-offset:2px}
.skc b{position:absolute;right:-8px;bottom:-8px;min-width:20px;padding:0 3px;height:20px;background:#0a0806;border:1px solid var(--line2);font-family:var(--ui);font-size:13px;display:grid;place-items:center;font-weight:500}
.skc b i{font-style:normal;color:var(--magic);font-size:11px;margin-left:1px}
.skinfo{width:100%;font-size:14px;line-height:1.4}
.skinfo h3{text-align:center;margin:0}
.skinfo p{margin:4px 0;color:#cfc7b4}
.skinfo .hintp{text-align:center;color:var(--ash)}
.skinfo .reqs{font-family:var(--ui);font-size:13px;color:var(--ash)}
.ok{color:var(--ok)}.no{color:var(--bad)}
.lvl{margin-top:6px;padding:6px 8px;background:rgba(0,0,0,.4);border:1px solid #2e251a;color:var(--magic);font-family:var(--ui);font-size:14px}
.lvl small{display:block;color:var(--ash);font-size:12px}
.lvl.syn{color:#cfc7b4}
.skact{display:flex;justify-content:center;margin-top:8px}
.skact button,.acts button{padding:8px 16px;background:linear-gradient(#3a2e1a,#16110a);border:1px solid #c9a24a;font-family:var(--ui);font-size:15px;color:var(--bone)}
.skact button:disabled,.acts button:disabled{opacity:.35;border-color:var(--line);cursor:default}
.assign{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;margin-top:8px}
.assign small{width:100%;text-align:center;color:var(--ash);font-family:var(--ui)}
.assign button{min-width:44px;padding:6px 8px;background:rgba(0,0,0,.5);border:1px solid var(--line);font-family:var(--ui);font-size:13px}
.assign button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.diffs button[aria-pressed=true]{color:var(--gold)}
.talk{font-size:16px;line-height:1.5;color:#e0d8c4;max-width:60ch;margin:0;font-style:italic}
.opts{width:100%}
.opts label{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;font-family:var(--ui);border-bottom:1px solid rgba(92,75,51,.3)}
.opts input{width:20px;height:20px;accent-color:#c9a24a}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0;width:100%}
.keys dt{font-family:var(--ui);color:var(--gold);white-space:nowrap}
.keys dd{margin:0;color:#cfc7b4}

/* tooltips */
#tip,#pop{position:fixed;z-index:9;max-width:min(320px,90vw);background:rgba(4,3,3,.93);border:1px solid #3a3024;padding:8px 12px;text-align:center;font-family:var(--ui);font-size:14px;line-height:1.35;pointer-events:none;box-shadow:0 6px 24px #000}
#pop{pointer-events:auto;z-index:10}
.tn{font-size:15px}
.mod{color:var(--magic)}
.req{display:block}.req.bad{color:var(--bad)}
.price{color:var(--gold);margin-top:4px}
.hintl{color:var(--ash);font-size:12px;margin-top:4px}
#pop .acts{margin-top:8px}
#pop .acts button{padding:7px 12px;font-size:14px}

/* screens */
.screen{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-block:calc(20px + var(--st)) calc(20px + var(--sb));padding-left:max(16px,var(--sl));padding-right:max(16px,var(--sr));text-align:center;overflow-y:auto;touch-action:pan-y}
#title{background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,.15),rgba(0,0,0,.8) 70%)}
#title h1{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(44px,11vw,104px);line-height:.95;letter-spacing:.06em;color:#d9c48a;text-shadow:0 0 28px rgba(200,40,20,.55),0 4px 0 #000,0 0 2px #000}
#title .tag{margin:0;font-family:var(--ui);font-size:clamp(15px,3.6vw,19px);color:var(--bone);letter-spacing:.1em;text-shadow:0 1px 3px #000}
#title .blurb{margin:0;max-width:52ch;color:#cfc7b4;font-size:15px;line-height:1.5;text-shadow:0 1px 3px #000}
.big{min-width:220px;padding:12px 26px;font-family:var(--disp);font-size:20px;letter-spacing:.06em;color:#f0e6cc;background:linear-gradient(#3a2414,#140c06);border:1px solid #c9a24a;box-shadow:inset 0 0 0 2px #000}
.big:hover{background:linear-gradient(#4a2e18,#1c1008)}
.ghostb{font-size:15px;min-width:0;padding:8px 16px;border-color:var(--line)}
#saveInfo{margin:-8px 0 0;color:var(--ash);font-family:var(--ui)}
.warn{margin:0;color:#e0a060;font-family:var(--ui);font-size:14px}
#newForm{display:flex;flex-direction:column;gap:10px;align-items:center}
#newForm label{font-family:var(--ui);color:var(--ash)}
#heroName{width:220px;padding:10px 12px;background:#0a0806;border:1px solid var(--line2);color:var(--bone);font-family:var(--disp);font-size:18px;text-align:center}
#death{background:radial-gradient(ellipse at center,rgba(60,0,0,.35),rgba(0,0,0,.85))}
#death h2{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(40px,9vw,84px);color:#c41a14;text-shadow:0 3px 0 #000,0 0 30px rgba(200,0,0,.5)}
#death p{margin:0;font-family:var(--ui);font-size:17px;color:var(--bone)}
@media (max-height:500px){
  .panel{padding:8px 10px 12px;gap:6px}
  .panel h2{font-size:18px}
  .panel .x{width:30px;height:30px}
  .srow{padding:2px 8px}.srow .sn{font-size:14px}.srow b{font-size:15px}.plus{height:24px}
  .rrow{font-size:13px;padding:1px 8px}
  .cmeta b{font-size:13px}
}
@media (prefers-reduced-motion:reduce){#banner{transition:none}}
</style>

<canvas id="game" aria-label="Blood Moor game view"></canvas>

<div id="hud" hidden>
  <div id="target" hidden><div class="tbar"><i></i><div class="tname"></div></div><div class="tmods"></div></div>
  <div id="globeL" class="globe" role="button" aria-label="Life, open character sheet"><canvas width="46" height="46"></canvas><span></span></div>
  <div id="globeR" class="globe" aria-label="Mana"><canvas width="46" height="46"></canvas><span></span></div>
  <div id="lvlBadge" aria-label="Character level">1</div><div id="ptsDot" hidden></div>
  <div id="buffs"></div>
  <div id="msgs" aria-live="polite"></div>
  <div id="strip"><div id="xpbar"><i></i></div><div id="belt"></div><div id="skillbar"></div></div>
  <div id="menubar">
    <button id="btnChar" class="stoneBtn" aria-label="Character (C)"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg></button>
    <button id="btnInv" class="stoneBtn" aria-label="Inventory (I)"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg></button>
    <button id="btnSkills" class="stoneBtn" aria-label="Skill tree (T)"><svg viewBox="0 0 24 24"><path d="M12 3v6M12 9l-6 5M12 9l6 5M6 14v6M18 14v6"/><circle cx="12" cy="3" r="1.5"/><circle cx="6" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg></button>
    <button id="btnMap" class="stoneBtn" aria-label="Automap (Tab)"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></button>
    <button id="btnTP" class="stoneBtn" aria-label="Cast Town Portal (F)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="6" ry="9"/><ellipse cx="12" cy="12" rx="2.5" ry="5"/></svg><span id="tpN">3</span></button>
    <button id="btnMenu" class="stoneBtn" aria-label="Game menu (Esc)"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div id="areaName"></div>
  <div id="banner"></div>
</div>
<div id="joy" hidden><div id="knob"></div></div>

<div id="panelL" class="panel" hidden></div>
<div id="panelR" class="panel" hidden></div>
<div id="tip" hidden></div>
<div id="pop" hidden></div>

<div id="title" class="screen">
  <h1>Blood Moor</h1>
  <p class="tag">The Sorceress · Act I</p>
  <p class="blurb">The dead walk the moor outside the Rogue Encampment. Master fire, cold and lightning, clear the Den of Evil, and gear up through Normal, Nightmare and Hell.</p>
  <p id="saveInfo" hidden></p>
  <button id="btnContinue" class="big" hidden>Continue</button>
  <button id="btnNew" class="big">New Sorceress</button>
  <form id="newForm" hidden>
    <label for="heroName">Name your Sorceress</label>
    <input id="heroName" maxlength="16" autocomplete="off" placeholder="Sorceress">
    <p id="overwrite" class="warn" hidden>Starting over replaces your saved Sorceress.</p>
    <button class="big" type="submit">Enter the Moor</button>
    <button class="big ghostb" type="button" id="btnBack">Back</button>
  </form>
</div>
<div id="death" class="screen" hidden>
  <h2>You have died</h2>
  <p id="deathSub"></p>
  <button id="btnRespawn" class="big">Return to camp</button>
</div>
