<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>DEEPBREAK — brick-breaking mining demo</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden;
    font-family:"Courier New",ui-monospace,monospace;color:#cfe3f2;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ---------------------------------------------------------------------------
// DEEPBREAK — a small brick-breaking roguelike mining demo.
// Dig with a bouncing ball, mine silver below the extractor beam limit,
// haul it back up into beam range and extract before the waves bury you.
// ---------------------------------------------------------------------------

// ---- constants ------------------------------------------------------------
const TILE = 14;
const WORLD_W = 150, WORLD_H = 240;      // in tiles
const SURFACE = 8;                        // first solid row
const BEAM_RANGE = 40;                    // extraction only at depth <= this
const BAND = [46, 150];                   // depth band where silver spawns
const SILVER_FULL = 8;                    // silver needed to finish the run
const WAVE_TIME = 45;                     // seconds between waves
const TETHER = 380;                       // how far the ball may stray from the pod

const EMPTY = 0, DIRT = 1, ROCK = 2, COPPER = 3, TIN = 4, IRON = 5, SILVER = 6;
const ORE_NAME = {3:'COPPER', 4:'TIN', 5:'IRON', 6:'SILVER'};
const ORE_COLOR = {3:'#e08a3c', 4:'#3fd6c0', 5:'#a05fd6', 6:'#dfe8f2'};

// ---- canvas ---------------------------------------------------------------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = cv.clientWidth; VH = cv.clientHeight;
  cv.width = Math.floor(VW * DPR); cv.height = Math.floor(VH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

// ---- helpers --------------------------------------------------------------
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rnd  = (a,b) => a + Math.random() * (b - a);
const rndi = (a,b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function hash2(x, y, s) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const fade = t => t * t * (3 - 2 * t);
function noise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), u = fade(x - xi), v = fade(y - yi);
  const a = hash2(xi, yi, s),     b = hash2(xi + 1, yi, s);
  const c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y, s, oct) {
  let f = 1, a = 0.5, sum = 0, norm = 0;
  for (let i = 0; i < (oct || 3); i++) { sum += a * noise(x * f, y * f, s + i * 101); norm += a; f *= 2; a *= 0.5; }
  return sum / norm;
}

// ---- world ----------------------------------------------------------------
const grid = new Uint8Array(WORLD_W * WORLD_H);   // tile type
const hpg  = new Uint8Array(WORLD_W * WORLD_H);   // remaining hits
const shd  = new Uint8Array(WORLD_W * WORLD_H);   // speckle shade 0..3
let silverLeft = 0;

const idx = (x, y) => y * WORLD_W + x;
const inBounds = (x, y) => x >= 0 && y >= 0 && x < WORLD_W && y < WORLD_H;
const tileAt = (x, y) => (x < 0 || x >= WORLD_W || y >= WORLD_H) ? ROCK : (y < 0 ? EMPTY : grid[idx(x, y)]);
const solidAt = (x, y) => tileAt(x, y) !== EMPTY;
const solidPx = (px, py) => solidAt(Math.floor(px / TILE), Math.floor(py / TILE));

function generate(seed) {
  silverLeft = 0;
  for (let y = 0; y < WORLD_H; y++) {
    const depth = y - SURFACE;
    for (let x = 0; x < WORLD_W; x++) {
      const i = idx(x, y);
      const stratum = Math.min(2, Math.floor(fbm(x * 0.018, y * 0.012, seed + 404, 2) * 3.4));
      shd[i] = stratum * 4 + Math.floor(hash2(x, y, seed + 7) * 4);
      if (y < SURFACE) { grid[i] = EMPTY; hpg[i] = 0; continue; }

      // cave shape: denser the deeper you go, with big hollow chambers punched out
      const cave = fbm(x * 0.055, y * 0.055, seed, 3);
      const bias = 0.46 - Math.min(0.14, depth * 0.0011);
      const chamber = fbm(x * 0.022, y * 0.03, seed + 77, 2);
      let t = (cave > bias && chamber < 0.62) ? DIRT : EMPTY;

      // rock pockets — three times as tough
      if (t && fbm(x * 0.09 + 40, y * 0.09, seed + 313, 2) > 0.58 - depth * 0.0006) t = ROCK;

      if (t) {
        const veinA = fbm(x * 0.19, y * 0.19, seed + 991, 2);
        const veinB = fbm(x * 0.17 + 9, y * 0.17, seed + 555, 2);
        if (depth >= BAND[0] && depth <= BAND[1] && veinB > 0.815) t = SILVER;
        else if (depth < 70 && veinA > 0.80) t = COPPER;
        else if (depth > 14 && depth < 120 && veinB > 0.805) t = TIN;
        else if (depth > 50 && veinA > 0.825) t = IRON;
      }
      grid[i] = t;
      hpg[i] = t === EMPTY ? 0 : t === ROCK ? 3 : t === IRON ? 2 : 1;
      if (t === SILVER) silverLeft++;
    }
  }
  // guarantee the run is completable
  if (silverLeft < SILVER_FULL * 3) {
    for (let n = silverLeft; n < SILVER_FULL * 3; n++) {
      const y = rndi(SURFACE + BAND[0], SURFACE + Math.min(BAND[1], WORLD_H - SURFACE - 2));
      const x = rndi(1, WORLD_W - 2), i = idx(x, y);
      if (grid[i] !== EMPTY) { grid[i] = SILVER; hpg[i] = 1; silverLeft++; }
    }
  }
  // starting pocket so the pod spawns free
  for (let y = SURFACE - 3; y < SURFACE + 4; y++)
    for (let x = (WORLD_W >> 1) - 4; x <= (WORLD_W >> 1) + 4; x++)
      if (inBounds(x, y)) { grid[idx(x, y)] = EMPTY; hpg[idx(x, y)] = 0; }
}

// Tile palettes. Dirt and rock come in three strata (chosen by a low-frequency
// noise) so the cave reads as bands of different stone instead of one flat colour.
const STRATA = {
  1: [['#2b3128', '#333a2e', '#3a4235', '#414a3b'],   // olive
      ['#3a3324', '#433b2a', '#4b4331', '#544b37'],   // khaki
      ['#20333a', '#263c44', '#2c454e', '#324e58']],  // teal
  2: [['#1e2430', '#242b39', '#2a3341', '#303a4a'],   // slate
      ['#2a2233', '#31283c', '#382e45', '#3f344e'],   // violet
      ['#2b2725', '#332e2b', '#3a3532', '#413c38']],  // ash
  3: [['#33291f', '#3b2f23', '#433628', '#4b3c2d']],
  4: [['#1a322d', '#1f3a34', '#24423b', '#294a42']],
  5: [['#282039', '#2e2542', '#342b4b', '#3a3154']],
  6: [['#343a41', '#3c434a', '#444c54', '#4c545e']],
};
const SHADES = 12;                                    // 3 strata x 4 speckle shades
const paletteFor = (type, v) => STRATA[type][(v >> 2) % STRATA[type].length][v & 3];
const dustColor = t => t >= COPPER ? ORE_COLOR[t] : paletteFor(t, 3);

// Pre-baked 14x14 pixel textures — one per (tile type, shade). Speckle and ore
// dots are painted once here instead of every frame.
const TEX = {};
function buildTextures() {
  for (const type of [DIRT, ROCK, COPPER, TIN, IRON, SILVER]) {
    TEX[type] = [];
    for (let s = 0; s < SHADES; s++) {
      const cnv = document.createElement('canvas');
      cnv.width = TILE; cnv.height = TILE;
      const g = cnv.getContext('2d');
      g.fillStyle = paletteFor(type, s);
      g.fillRect(0, 0, TILE, TILE);
      // grain
      for (let py = 0; py < TILE; py += 2)
        for (let px = 0; px < TILE; px += 2) {
          const h = hash2(px * 7 + s * 131, py * 13 + type * 17, 4242 + s * 977);
          if (h > 0.72) { g.fillStyle = 'rgba(255,255,255,0.06)'; g.fillRect(px, py, 2, 2); }
          else if (h < 0.16) { g.fillStyle = 'rgba(0,0,0,0.22)'; g.fillRect(px, py, 2, 2); }
        }
      if (type === ROCK) { g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(0, 0, TILE, 2); g.fillRect(0, 0, 2, TILE); }
      if (type >= COPPER) {
        const c = ORE_COLOR[type];
        g.fillStyle = 'rgba(0,0,0,0.35)';
        g.fillRect(3, 4, 4, 4); g.fillRect(8, 8, 4, 4);
        g.fillStyle = c;
        g.fillRect(3, 4, 3, 3); g.fillRect(8, 8, 3, 3);
        if (type === SILVER) { g.fillStyle = 'rgba(223,232,242,0.30)'; g.fillRect(2, 2, TILE - 4, TILE - 4); }
      }
      TEX[type].push(cnv);
    }
  }
}
buildTextures();

// ---- game state -----------------------------------------------------------
let state = 'title';         // title | play | upgrade | won | lost
const pod = { x:0, y:0, vx:0, vy:0, w:18, h:16, hp:100, maxHp:100, iframe:0 };
let balls = [], enemies = [], shots = [], drops = [], parts = [], floats = [];
const cam = { x:0, y:0, shake:0 };
const mouse = { x:0, y:0, down:false };
const keys = Object.create(null);

let cargo = 0, bank = 0;
const supp = { 3:0, 4:0, 5:0 };
let power = 9, maxPower = 9, powerT = 0;
let wave = 1, waveT = WAVE_TIME, extracting = 0, pingT = 0;
let upgradePts = 0, upgradeNeed = 20, upgradeReady = false, choices = [];
const owned = Object.create(null);
let lastCard = null, impacts = 0, blocksBroken = 0, runTime = 0, msg = '', msgT = 0;

// upgrade pool -------------------------------------------------------------
const UPGRADES = [
  { id:'aftershock', name:'AFTERSHOCK ENGINE', desc:'EVERY 6 IMPACT ATTACKS, A BLAST HAPPENS WHERE YOU HIT.' },
  { id:'heavycore',  name:'HEAVY CORE',        desc:'THE BALL CHEWS A WIDER HOLE THROUGH ROCK.' },
  { id:'overclock',  name:'OVERCLOCK',         desc:'BALL SPEED +22%. IT HITS HARDER, TOO.' },
  { id:'twin',       name:'TWIN LAUNCHER',     desc:'LAUNCH AN EXTRA BALL ON EVERY THROW.' },
  { id:'magnet',     name:'MAGNETIC HULL',     desc:'ORE IS PULLED IN FROM MUCH FURTHER OUT.' },
  { id:'plating',    name:'REINFORCED PLATING',desc:'+25 MAX HULL, AND PATCH 25 RIGHT NOW.' },
  { id:'capacitor',  name:'CAPACITOR BANK',    desc:'+2 POWER CELLS AND FASTER RECHARGE.' },
  { id:'prospector', name:'PROSPECTOR RIG',    desc:'EVERY ORE BLOCK YIELDS ONE EXTRA UNIT.' },
  { id:'surge',      name:'SURGE',             desc:'SLAM COSTS 1 LESS AND KNOCKS HARDER.' },
];
const has = id => (owned[id] | 0);

function resetRun() {
  generate((Math.random() * 1e9) | 0);
  pod.x = (WORLD_W >> 1) * TILE; pod.y = (SURFACE - 1) * TILE;
  pod.vx = pod.vy = 0; pod.hp = pod.maxHp = 100; pod.iframe = 0;
  balls = []; enemies = []; shots = []; drops = []; parts = []; floats = [];
  cargo = 0; bank = 0; supp[3] = supp[4] = supp[5] = 0;
  maxPower = 9; power = 9; powerT = 0;
  wave = 1; waveT = WAVE_TIME; extracting = 0; pingT = 0;
  upgradePts = 0; upgradeNeed = 20; upgradeReady = false; choices = [];
  for (const k in owned) delete owned[k];
  lastCard = null; impacts = 0; blocksBroken = 0; runTime = 0; msg = ''; msgT = 0; maxDepth = 0;
  cam.x = pod.x - VW / 2; cam.y = pod.y - VH / 2; cam.shake = 0;
  spawnWave(1);
}

const depthOf = y => Math.max(0, Math.round(y / TILE) - SURFACE);
const podDepth = () => depthOf(pod.y);
const inBeamRange = () => podDepth() <= BEAM_RANGE;

function say(t) { msg = t; msgT = 2.2; }

// ---- input ----------------------------------------------------------------
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if ([' ', 'arrowleft', 'arrowright', 'arrowup', 'arrowdown'].includes(k)) e.preventDefault();
  if (state === 'title' || state === 'won' || state === 'lost') {
    if (k === ' ' || k === 'enter') { resetRun(); state = 'play'; }
    return;
  }
  if (state === 'upgrade') {
    const n = parseInt(k, 10);
    if (n >= 1 && n <= choices.length) takeUpgrade(choices[n - 1]);
    return;
  }
  if (k === 'w') launch();
  if (k === ' ') recall();
  if (k === 'r') slam();
  if (k === 'e') ping();
  if (k === 'x') extract();
  if (k === 'f') forceWave();
  if (k === 'u' && upgradeReady) openUpgrades();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function localPt(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
cv.addEventListener('mousemove', e => { const p = localPt(e); mouse.x = p.x; mouse.y = p.y; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('mousedown', e => {
  e.preventDefault();
  const p = localPt(e); mouse.x = p.x; mouse.y = p.y; mouse.down = true;
  if (state === 'title' || state === 'won' || state === 'lost') { resetRun(); state = 'play'; return; }
  if (state === 'upgrade') { clickUpgrade(p.x, p.y); return; }
  launch();
});
addEventListener('mouseup', () => { mouse.down = false; });

// touch: drag steers the pod, tap launches toward the touch point
let touchPt = null, buttonTouch = false;
cv.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0], r = cv.getBoundingClientRect();
  const p = { x: t.clientX - r.left, y: t.clientY - r.top };
  mouse.x = p.x; mouse.y = p.y;
  if (state === 'title' || state === 'won' || state === 'lost') { resetRun(); state = 'play'; return; }
  if (state === 'upgrade') { clickUpgrade(p.x, p.y); return; }
  if (touchButton(p.x, p.y)) { touchPt = null; buttonTouch = true; return; }
  buttonTouch = false; touchPt = p;
  launch();
}, { passive:false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.changedTouches[0], r = cv.getBoundingClientRect();
  if (buttonTouch) return;
  mouse.x = t.clientX - r.left; mouse.y = t.clientY - r.top; touchPt = { x: mouse.x, y: mouse.y };
}, { passive:false });
cv.addEventListener('touchend', e => { e.preventDefault(); touchPt = null; buttonTouch = false; }, { passive:false });

// on-screen buttons (mobile)
const compact = () => VW < 820;      // phone-shaped: swap in the touch layout
function touchButtons() {
  if (!compact()) return [];
  const pad = 6, n = 5, w = (VW - pad * (n + 1)) / n, h = 48, y = VH - h - pad;
  const defs = [
    ['SPACE', 'RECALL', recall], ['E', 'PING', ping], ['R', 'SLAM', slam],
    ['X', 'EXTRACT', extract], ['U', 'UPGRADE', () => upgradeReady && openUpgrades()],
  ];
  return defs.map(([k, label, fn], i) => ({ k, label, fn, x: pad + i * (w + pad), y, w, h }));
}
function touchButton(x, y) {
  for (const b of touchButtons())
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return true; }
  return false;
}

// ---- actions --------------------------------------------------------------
const ballSpeed = () => 400 * (1 + 0.22 * has('overclock'));

function launch() {
  if (state !== 'play') return;
  const live = balls.filter(b => !b.returning);
  const maxBalls = 1 + has('twin');
  const aimX = mouse.x + cam.x, aimY = mouse.y + cam.y;
  if (live.length >= maxBalls) {
    // already out — the click kicks it toward the cursor instead
    for (const b of live) {
      if (b.life > 5.7) continue;                       // no instant double-kick
      const a = Math.atan2(aimY - b.y, aimX - b.x), sp = ballSpeed();
      b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
      floats.push({ x: b.x, y: b.y - 10, t: 0.4, text: 'KICK', c: '#9fd8ff' });
    }
    return;
  }
  const ang = Math.atan2(aimY - pod.y, aimX - pod.x);
  const n = maxBalls - live.length;
  for (let i = 0; i < n; i++) {
    const a = ang + (n > 1 ? (i - (n - 1) / 2) * 0.22 : 0);
    const sp = ballSpeed();
    balls.push({ x: pod.x, y: pod.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 5, life: 6, returning: false, stuck: 0 });
  }
}
function recall() { for (const b of balls) b.returning = true; }

function slam() {
  if (state !== 'play') return;
  const cost = Math.max(1, 3 - has('surge'));
  if (power < cost) { say('NOT ENOUGH POWER'); return; }
  power -= cost;
  const rad = 3 + has('surge');
  blastAt(pod.x, pod.y, rad, 4);
  pod.vy -= 240;
  cam.shake = 12;
  floats.push({ x: pod.x, y: pod.y - 24, t: 0.9, text: 'BOOM!', c: '#ffcf5a' });
}
function ping() {
  if (state !== 'play' || power < 1) return;
  power -= 1; pingT = 4;
  floats.push({ x: pod.x, y: pod.y - 24, t: 0.8, text: 'PING', c: '#6fe3ff' });
}
function forceWave() {
  if (state !== 'play') return;
  waveT = 0;
  power = Math.min(maxPower, power + 2);
  say('WAVE FORCED — +2 POWER');
}
function extract() {
  if (state !== 'play') return;
  if (!inBeamRange()) { say('OUT OF BEAM RANGE — CLIMB TO ' + BEAM_RANGE + 'M'); return; }
  if (cargo <= 0) { say('CARGO EMPTY'); return; }
  extracting = 1.4;
}

// ---- upgrades -------------------------------------------------------------
function openUpgrades() {
  const pool = UPGRADES.slice();
  choices = [];
  while (choices.length < 3 && pool.length) choices.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  state = 'upgrade';
}
function takeUpgrade(u) {
  owned[u.id] = has(u.id) + 1;
  lastCard = u;
  if (u.id === 'plating') { pod.maxHp += 25; pod.hp = Math.min(pod.maxHp, pod.hp + 25); }
  if (u.id === 'capacitor') { maxPower += 2; power = maxPower; }
  upgradeReady = false;
  upgradeNeed += 25;
  state = 'play';
}
function upgradeCards() {
  const w = Math.min(300, (VW - 80) / 3), h = 190, gap = 18;
  const total = w * 3 + gap * 2, x0 = (VW - total) / 2, y0 = VH / 2 - h / 2;
  return choices.map((u, i) => ({ u, x: x0 + i * (w + gap), y: y0, w, h }));
}
function clickUpgrade(mx, my) {
  for (const c of upgradeCards())
    if (mx >= c.x && mx <= c.x + c.w && my >= c.y && my <= c.y + c.h) { takeUpgrade(c.u); return; }
}

// ---- world interaction ----------------------------------------------------
function breakTile(tx, ty, force) {
  if (!inBounds(tx, ty)) return false;
  const i = idx(tx, ty), t = grid[i];
  if (t === EMPTY) return false;
  const left = hpg[i] - (force || 1);          // hpg is a Uint8Array: never let it wrap
  if (left > 0) { hpg[i] = left; burst(tx * TILE + TILE / 2, ty * TILE + TILE / 2, 2, dustColor(t)); return false; }
  hpg[i] = 0;
  grid[i] = EMPTY;
  blocksBroken++;
  burst(tx * TILE + TILE / 2, ty * TILE + TILE / 2, 5, dustColor(t));
  if (t >= COPPER) {
    if (t === SILVER) silverLeft--;
    const n = 1 + has('prospector');
    for (let k = 0; k < n; k++)
      drops.push({ x: tx * TILE + TILE / 2 + rnd(-3, 3), y: ty * TILE + TILE / 2 + rnd(-3, 3),
                   vx: rnd(-40, 40), vy: rnd(-60, -10), t, life: 26 });
  }
  return true;
}
function blastAt(px, py, radTiles, force) {
  const cx = Math.floor(px / TILE), cy = Math.floor(py / TILE);
  for (let y = cy - radTiles; y <= cy + radTiles; y++)
    for (let x = cx - radTiles; x <= cx + radTiles; x++) {
      const d = Math.hypot(x - cx, y - cy);
      if (d <= radTiles + 0.2) breakTile(x, y, force || 2);
    }
  for (const e of enemies) if (Math.hypot(e.x - px, e.y - py) < radTiles * TILE + 12) hurtEnemy(e, 3, px, py);
  for (let i = 0; i < 18; i++) burst(px, py, 1, pick(['#ffcf5a', '#ff8a3c', '#fff0c0']));
  cam.shake = Math.max(cam.shake, 8);
}
function burst(x, y, n, c) {
  for (let i = 0; i < n; i++)
    parts.push({ x, y, vx: rnd(-90, 90), vy: rnd(-110, 40), life: rnd(0.25, 0.7), c, s: rnd(1.5, 3.5) });
}

// ---- enemies --------------------------------------------------------------
function spawnWave(n) {
  const count = 1 + n;
  for (let i = 0; i < count; i++) {
    const ang = rnd(0, Math.PI * 2), dist = rnd(340, 520);
    const x = clamp(pod.x + Math.cos(ang) * dist, TILE, (WORLD_W - 1) * TILE);
    const y = clamp(pod.y + Math.sin(ang) * dist, (SURFACE - 4) * TILE, (WORLD_H - 2) * TILE);
    const spitter = n >= 2 && Math.random() < 0.35;
    enemies.push({ x, y, vx:0, vy:0, hp: spitter ? 3 : 2, type: spitter ? 'spitter' : 'crawler',
                   cool: rnd(1, 3), flash: 0, r: 9 });
  }
  floats.push({ x: pod.x, y: pod.y - 40, t: 1.4, text: 'WAVE ' + n, c: '#ff6b6b' });
}
function hurtEnemy(e, dmg, fx, fy) {
  e.hp -= dmg; e.flash = 0.12;
  const a = Math.atan2(e.y - fy, e.x - fx);
  e.vx += Math.cos(a) * 140; e.vy += Math.sin(a) * 140;
  if (e.hp <= 0) {
    burst(e.x, e.y, 12, '#ff6b6b');
    floats.push({ x: e.x, y: e.y, t: 0.6, text: pick(['KAPOW!', 'THWACK!', 'CRUNCH!']), c: '#ff8a8a' });
    enemies.splice(enemies.indexOf(e), 1);
  }
}
function hurtPod(dmg) {
  if (pod.iframe > 0) return;
  pod.hp -= dmg; pod.iframe = 1.1; cam.shake = 10;
  floats.push({ x: pod.x, y: pod.y - 18, t: 0.7, text: '-' + dmg, c: '#ff6b6b' });
  if (pod.hp <= 0) { pod.hp = 0; state = 'lost'; }
}

// ---- update ---------------------------------------------------------------
function update(dt) {
  runTime += dt;
  if (msgT > 0) msgT -= dt;
  if (pingT > 0) pingT -= dt;
  if (cam.shake > 0) cam.shake = Math.max(0, cam.shake - dt * 40);

  // power regen
  powerT += dt * (1 + 0.6 * has('capacitor'));
  if (powerT > 2.4) { powerT = 0; power = Math.min(maxPower, power + 1); }

  // waves
  waveT -= dt;
  if (waveT <= 0) { wave++; waveT = WAVE_TIME; spawnWave(wave); }

  // ---- pod ----
  const left = keys['a'] || keys['arrowleft'], right = keys['d'] || keys['arrowright'];
  const thrust = keys['arrowup'] || keys['shift'];
  let ax = 0;
  if (left) ax -= 1100; if (right) ax += 1100;
  // touch: the pod flies toward wherever the finger is held
  if (touchPt) {
    ax += clamp((touchPt.x - (pod.x - cam.x)) * 9, -1100, 1100);
    pod.vy += clamp((touchPt.y - (pod.y - cam.y)) * 9, -1000, 700) * dt;
  }
  pod.vx += ax * dt;
  pod.vy += (thrust ? -1000 : 0) * dt + 260 * dt;      // gentle sink, strong thrust
  if (keys['arrowdown'] || keys['s']) pod.vy += 700 * dt;
  pod.vx *= Math.pow(0.02, dt); pod.vy *= Math.pow(0.12, dt);
  pod.vx = clamp(pod.vx, -260, 260); pod.vy = clamp(pod.vy, -240, 240);
  movePod(dt);
  if (pod.iframe > 0) pod.iframe -= dt;

  // extraction beam
  if (extracting > 0) {
    extracting -= dt;
    if (extracting <= 0) {
      bank += cargo;
      floats.push({ x: pod.x, y: pod.y - 30, t: 1.6, text: '+' + cargo + ' SILVER BANKED', c: '#dfe8f2' });
      cargo = 0;
      if (bank >= SILVER_FULL) state = 'won';
    }
    if (!inBeamRange()) extracting = 0;
  }

  // ---- balls ----
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    b.life -= dt;
    if (b.life <= 0) b.returning = true;
    if (b.returning) {
      const a = Math.atan2(pod.y - b.y, pod.x - b.x), sp = 760;
      b.x += Math.cos(a) * sp * dt; b.y += Math.sin(a) * sp * dt;
      if (Math.hypot(pod.x - b.x, pod.y - b.y) < 16) balls.splice(i, 1);
      continue;
    }
    stepBall(b, dt);
    // enemies
    for (const e of enemies.slice())
      if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + b.r) {
        hurtEnemy(e, 2 + has('overclock'), b.x, b.y);
        const a = Math.atan2(b.y - e.y, b.x - e.x), sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
      }
  }

  // ---- enemies ----
  for (const e of enemies) {
    if (e.flash > 0) e.flash -= dt;
    const a = Math.atan2(pod.y - e.y, pod.x - e.x);
    const dist = Math.hypot(pod.x - e.x, pod.y - e.y);
    if (e.type === 'crawler') { e.vx += Math.cos(a) * 140 * dt; e.vy += Math.sin(a) * 140 * dt; }
    else {
      const want = dist < 170 ? -1 : dist > 260 ? 1 : 0;
      e.vx += Math.cos(a) * 150 * want * dt; e.vy += Math.sin(a) * 150 * want * dt;
      e.cool -= dt;
      if (e.cool <= 0 && dist < 420) {
        e.cool = 2.6;
        shots.push({ x: e.x, y: e.y, vx: Math.cos(a) * 190, vy: Math.sin(a) * 190, life: 4 });
      }
    }
    e.vx *= Math.pow(0.25, dt); e.vy *= Math.pow(0.25, dt);
    e.x = clamp(e.x + e.vx * dt, 0, WORLD_W * TILE);
    e.y = clamp(e.y + e.vy * dt, 0, WORLD_H * TILE);
    if (dist < 16) hurtPod(6);
  }

  // ---- shots ----
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0 || solidPx(s.x, s.y)) { burst(s.x, s.y, 3, '#ff6b6b'); shots.splice(i, 1); continue; }
    if (Math.hypot(pod.x - s.x, pod.y - s.y) < 14) { hurtPod(5); shots.splice(i, 1); }
  }

  // ---- drops ----
  const magnet = 70 + 90 * has('magnet');
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.life -= dt;
    const dist = Math.hypot(pod.x - d.x, pod.y - d.y);
    if (dist < magnet) {
      const a = Math.atan2(pod.y - d.y, pod.x - d.x), sp = 260 + (magnet - dist);
      d.vx = Math.cos(a) * sp; d.vy = Math.sin(a) * sp;
    } else { d.vy += 220 * dt; d.vx *= Math.pow(0.4, dt); }
    const nx = d.x + d.vx * dt, ny = d.y + d.vy * dt;
    if (dist < magnet || !solidPx(nx, d.y)) d.x = nx; else d.vx = 0;
    if (dist < magnet || !solidPx(d.x, ny)) d.y = ny; else d.vy = 0;
    if (dist < 14) {
      if (d.t === SILVER) { cargo++; floats.push({ x: pod.x, y: pod.y - 20, t: 0.8, text: '+SILVER', c: '#dfe8f2' }); }
      else { supp[d.t]++; upgradePts++; }
      if (!upgradeReady && upgradePts >= upgradeNeed) { upgradeReady = true; }
      drops.splice(i, 1); continue;
    }
    if (d.life <= 0) drops.splice(i, 1);
  }

  // ---- particles / floats ----
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; p.vy += 320 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i]; f.t -= dt; f.y -= 22 * dt;
    if (f.t <= 0) floats.splice(i, 1);
  }

  // ---- camera ----
  const tx = clamp(pod.x - VW / 2, 0, Math.max(0, WORLD_W * TILE - VW));
  const ty = clamp(pod.y - VH * 0.45, -60, Math.max(0, WORLD_H * TILE - VH));
  cam.x += (tx - cam.x) * Math.min(1, dt * 7);
  cam.y += (ty - cam.y) * Math.min(1, dt * 7);
}

function movePod(dt) {
  const hw = pod.w / 2, hh = pod.h / 2;
  // x
  let nx = pod.x + pod.vx * dt;
  if (podHits(nx, pod.y, hw, hh)) { pod.vx = 0; nx = pod.x; }
  pod.x = clamp(nx, hw, WORLD_W * TILE - hw);
  // y
  let ny = pod.y + pod.vy * dt;
  if (podHits(pod.x, ny, hw, hh)) { pod.vy = 0; ny = pod.y; }
  pod.y = clamp(ny, -200, WORLD_H * TILE - hh);
}
function podHits(x, y, hw, hh) {
  const x0 = Math.floor((x - hw) / TILE), x1 = Math.floor((x + hw) / TILE);
  const y0 = Math.floor((y - hh) / TILE), y1 = Math.floor((y + hh) / TILE);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, ty)) return true;
  return false;
}

function stepBall(b, dt) {
  // if the ball ever ends up buried, chew a single tile per frame until it is free
  if (solidPx(b.x, b.y)) {
    b.stuck = (b.stuck || 0) + 1;
    if (b.stuck > 2) breakTile(Math.floor(b.x / TILE), Math.floor(b.y / TILE), 4);
  } else b.stuck = 0;
  const speed = Math.hypot(b.vx, b.vy);
  const steps = Math.max(1, Math.ceil(speed * dt / (TILE * 0.4)));
  const h = dt / steps;
  const rad = 1 + has('heavycore');
  const force = 1 + has('overclock');
  for (let s = 0; s < steps; s++) {
    // x axis
    let nx = b.x + b.vx * h;
    if (solidPx(nx, b.y)) {
      onImpact(b, nx, b.y, rad, force);
      b.vx = -b.vx * 1.0; nx = b.x;
    }
    b.x = clamp(nx, 2, WORLD_W * TILE - 2);
    if (b.x <= 2 || b.x >= WORLD_W * TILE - 2) b.vx = -b.vx;
    // y axis
    let ny = b.y + b.vy * h;
    if (solidPx(b.x, ny)) {
      onImpact(b, b.x, ny, rad, force);
      b.vy = -b.vy; ny = b.y;
    }
    b.y = ny;
    if (b.y < -400) { b.vy = Math.abs(b.vy); }
    if (b.y > WORLD_H * TILE - 2) { b.y = WORLD_H * TILE - 2; b.vy = -Math.abs(b.vy); }
  }
  // tether: the ball can never wander further than this from the pod
  const dx = b.x - pod.x, dy = b.y - pod.y, dist = Math.hypot(dx, dy);
  if (dist > TETHER) {
    const a = Math.atan2(-dy, -dx) + rnd(-0.5, 0.5), sp0 = Math.hypot(b.vx, b.vy);
    b.vx = Math.cos(a) * sp0; b.vy = Math.sin(a) * sp0;
    b.x = pod.x + dx / dist * TETHER; b.y = pod.y + dy / dist * TETHER;
  }
  // keep the ball lively
  const sp = Math.hypot(b.vx, b.vy), want = ballSpeed();
  if (sp > 1) { b.vx = b.vx / sp * want; b.vy = b.vy / sp * want; }
}

function onImpact(b, px, py, rad, force) {
  const cx = Math.floor(px / TILE), cy = Math.floor(py / TILE);
  for (let y = cy - rad + 1; y <= cy + rad - 1; y++)
    for (let x = cx - rad + 1; x <= cx + rad - 1; x++) breakTile(x, y, force);
  // chew one tile further into the wall so tunnels end up pod-sized
  breakTile(cx + Math.sign(b.vx), cy, force);
  breakTile(cx, cy + Math.sign(b.vy), force);
  if (rad > 1) { breakTile(cx + 1, cy, force); breakTile(cx - 1, cy, force); breakTile(cx, cy + 1, force); breakTile(cx, cy - 1, force); }
  impacts++;
  cam.shake = Math.max(cam.shake, 3);
  if (has('aftershock') && impacts % 6 === 0) {
    blastAt(px, py, 2 + has('aftershock'), 3);
    floats.push({ x: px, y: py, t: 0.7, text: 'AFTERSHOCK', c: '#ffcf5a' });
  }
  // tiny random jitter so the ball never locks into a perfect loop
  b.vx += rnd(-14, 14); b.vy += rnd(-14, 14);
}

// ---- render ---------------------------------------------------------------
function txt(s, x, y, c, size, align, alpha) {
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = c; ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = (size || 12) + 'px "Courier New",monospace';

  ctx.globalAlpha = 1;
}
function bar(x, y, w, h, frac, fg, bg, border) {
  ctx.fillStyle = bg || '#101720'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = fg; ctx.fillRect(x + 1, y + 1, Math.max(0, (w - 2) * clamp(frac, 0, 1)), h - 2);
  if (border !== false) { ctx.strokeStyle = '#2b3a4a'; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1); }
}

function drawWorld() {
  const ox = -Math.round(cam.x) + (cam.shake ? rndi(-cam.shake, cam.shake) / 3 : 0);
  const oy = -Math.round(cam.y) + (cam.shake ? rndi(-cam.shake, cam.shake) / 3 : 0);
  const x0 = Math.max(0, Math.floor(cam.x / TILE)), x1 = Math.min(WORLD_W - 1, Math.ceil((cam.x + VW) / TILE));
  const y0 = Math.max(0, Math.floor(cam.y / TILE)), y1 = Math.min(WORLD_H - 1, Math.ceil((cam.y + VH) / TILE));
  const ores = [];
  for (let y = y0; y <= y1; y++) {
    const py = y * TILE + oy;
    for (let x = x0; x <= x1; x++) {
      const i = idx(x, y), t = grid[i];
      if (t === EMPTY) continue;
      ctx.drawImage(TEX[t][shd[i]], x * TILE + ox, py);
      if (t >= COPPER) ores.push([x, y, t]);
    }
  }
  // ping outlines
  if (pingT > 0) {
    ctx.globalAlpha = 0.4 + 0.3 * Math.sin(runTime * 12);
    ctx.lineWidth = 1;
    for (const [x, y, t] of ores) {
      ctx.strokeStyle = ORE_COLOR[t];
      ctx.strokeRect(x * TILE + ox + .5, y * TILE + oy + .5, TILE - 1, TILE - 1);
    }
    ctx.globalAlpha = 1;
  }

  // cave darkness — the deeper you are, the smaller your pool of light
  const dark = clamp(podDepth() / 90, 0, 1) * 0.78;
  if (dark > 0.02) {
    const px0 = pod.x + ox, py0 = pod.y + oy, R = 300 + 120 * (1 - dark);
    const g = ctx.createRadialGradient(px0, py0, R * 0.25, px0, py0, R);
    g.addColorStop(0, 'rgba(3,4,8,0)');
    g.addColorStop(0.6, 'rgba(3,4,8,' + (dark * 0.55).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(3,4,8,' + dark.toFixed(3) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  }

  // extractor beam limit
  const limitY = (SURFACE + BEAM_RANGE) * TILE + oy;
  if (limitY > -40 && limitY < VH + 40) {
    ctx.save();
    ctx.strokeStyle = '#7f8fa0'; ctx.globalAlpha = 0.7; ctx.lineWidth = 1;
    ctx.setLineDash([8, 8]);
    ctx.beginPath(); ctx.moveTo(0, limitY + .5); ctx.lineTo(VW, limitY + .5); ctx.stroke();
    ctx.restore();
    txt('EXTRACTOR BEAM LIMIT', VW / 2, limitY - 6, '#8fa9c0', 12, 'center', 0.8);
  }

  // drops
  for (const d of drops) {
    ctx.fillStyle = ORE_COLOR[d.t];
    const s = d.t === SILVER ? 7 : 5;
    ctx.fillRect(Math.round(d.x + ox - s / 2), Math.round(d.y + oy - s / 2), s, s);
  }
  // particles
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life * 2, 0, 1); ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x + ox), Math.round(p.y + oy), p.s, p.s);
  }
  ctx.globalAlpha = 1;

  // enemies
  for (const e of enemies) {
    const px = Math.round(e.x + ox), py = Math.round(e.y + oy);
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : (e.type === 'spitter' ? '#c96bff' : '#ff5a5a');
    ctx.fillRect(px - 7, py - 7, 14, 14);
    ctx.fillStyle = '#1a0e12';
    ctx.fillRect(px - 4, py - 3, 3, 3); ctx.fillRect(px + 1, py - 3, 3, 3);
    if (e.type === 'spitter') { ctx.fillStyle = '#ffd0ff'; ctx.fillRect(px - 2, py + 3, 4, 2); }
  }
  // shots
  ctx.fillStyle = '#ff8a8a';
  for (const s of shots) ctx.fillRect(Math.round(s.x + ox) - 2, Math.round(s.y + oy) - 2, 4, 4);

  // tether + balls
  for (const b of balls) {
    ctx.strokeStyle = b.returning ? '#4b6b8a' : '#e8f2ff';
    ctx.globalAlpha = b.returning ? 0.4 : 0.55; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pod.x + ox, pod.y + oy); ctx.lineTo(b.x + ox, b.y + oy); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(Math.round(b.x + ox) - b.r, Math.round(b.y + oy) - b.r, b.r * 2, b.r * 2);
    ctx.fillStyle = '#9fd8ff';
    ctx.fillRect(Math.round(b.x + ox) - 2, Math.round(b.y + oy) - 2, 4, 4);
  }

  // pod
  const px = Math.round(pod.x + ox), py = Math.round(pod.y + oy);
  if (extracting > 0) {
    ctx.globalAlpha = 0.25 + 0.2 * Math.sin(runTime * 20);
    ctx.fillStyle = '#9fe8ff'; ctx.fillRect(px - 10, 0, 20, py);
    ctx.globalAlpha = 1;
  }
  ctx.globalAlpha = pod.iframe > 0 && Math.floor(runTime * 20) % 2 ? 0.35 : 1;
  ctx.fillStyle = '#0a1a26'; ctx.fillRect(px - 11, py - 10, 22, 20);
  ctx.fillStyle = '#2f9bd6'; ctx.fillRect(px - 10, py - 9, 20, 18);
  ctx.fillStyle = '#7fd2ff'; ctx.fillRect(px - 10, py - 9, 20, 3);
  ctx.fillStyle = '#eaf8ff'; ctx.fillRect(px - 6, py - 5, 5, 11); ctx.fillRect(px + 1, py - 5, 5, 11);
  ctx.fillStyle = '#0f2a3a'; ctx.fillRect(px - 10, py + 6, 20, 3);
  ctx.fillStyle = '#ff6b6b';
  ctx.fillRect(px - 8, py + 9, 2, 5); ctx.fillRect(px + 6, py + 9, 2, 5);
  ctx.globalAlpha = 1;

  // floating text
  for (const f of floats) {
    ctx.globalAlpha = clamp(f.t * 1.6, 0, 1);
    txt(f.text, f.x + ox, f.y + oy, f.c, 13, 'center');
    ctx.globalAlpha = 1;
  }

  // aim reticle
  if (state === 'play') {
    ctx.strokeStyle = '#7fd2ff'; ctx.globalAlpha = 0.6; ctx.lineWidth = 1;
    ctx.strokeRect(Math.round(mouse.x) - 5.5, Math.round(mouse.y) - 5.5, 11, 11);
    ctx.globalAlpha = 1;
  }
}

    txt(lastCard.name, x + 24, y + 20, '#e8a33d', 13);
    const n = has(lastCard.id);
    for (let i = 0; i < Math.min(n, 8); i++) { ctx.fillStyle = '#e8a33d'; ctx.fillRect(x + 190 + i * 8, y + 12, 6, 7); }
    txt(String(n), x + w - 10, y + 20, '#eef6ff', 12, 'right');
    txt(lastCard.desc, x + 8, y + 33, '#c99a4e', 11);
  }

  // control bar
  const keysRow = [
    ['A/D', 'MOVE', '#8fd2ff'], ['↑', 'THRUST', '#8fd2ff'], ['SPACE', 'RECALL', '#8fd2ff'],
    ['LMB/W', 'LAUNCH', '#7fe3c0'], ['E', 'PING', '#7fe3c0'], ['R', 'SLAM', '#c96bff'],
    ['X', 'EXTRACT', '#e8a33d'], ['F', 'FORCE WAVE', '#ff8a8a'],
  ];
  let bx = cx - (keysRow.length * 108) / 2, by = VH - 34;
  txt('YOU', cx - 210, by - 8, '#5d6b78', 11, 'center');
  txt('TOOLS', cx + 130, by - 8, '#5d6b78', 11, 'center');
  for (const [k, label, c] of keysRow) {
    ctx.strokeStyle = c; ctx.globalAlpha = 0.5; ctx.strokeRect(bx + .5, by + .5, 102, 20); ctx.globalAlpha = 1;
    txt(k, bx + 7, by + 15, c, 12);
    txt(label, bx + 96, by + 15, '#8fa9c0', 10, 'right');
    bx += 108;
  }

  if (msgT > 0) txt(msg, cx, VH * 0.42, '#ffcf5a', 14, 'center', clamp(msgT, 0, 1));
}

// Phone layout: the same readouts, stacked into a thin strip plus a thumb row.
function drawHUDCompact() {
  const L = 10, W = VW - 20, cx = VW / 2;
  ctx.fillStyle = 'rgba(4,7,12,0.85)'; ctx.fillRect(0, 0, VW, 106);
  // hp + power side by side
  bar(L, 8, W * 0.62, 14, pod.hp / pod.maxHp, '#49d94f');
  txt(Math.ceil(pod.hp) + '/' + pod.maxHp, L + W * 0.31, 19, '#0b1a0d', 11, 'center');
  const pw = W * 0.34, px0 = L + W * 0.66, segW = pw / maxPower;
  for (let i = 0; i < maxPower; i++) {
    ctx.fillStyle = i < power ? '#e8a33d' : '#2a2416';
    ctx.fillRect(px0 + i * segW + 1, 8, segW - 2, 14);
  }
  // depth / range / wave
  const d = podDepth(), ir = inBeamRange();
  txt('DEPTH ' + d, L, 44, '#cfe3f2', 18);
  txt(ir ? 'IN RANGE' : 'OUT OF RANGE', L + 108, 44, ir ? '#49d94f' : '#ff6b6b', 11);
  txt('WAVE ' + wave + '  ' + Math.ceil(waveT) + 'S', VW - L, 44, '#cfe3f2', 12, 'right');
  bar(L, 50, W, 5, 1 - waveT / WAVE_TIME, '#4a7fa8', '#101720', false);
  // silver
  ctx.fillStyle = ORE_COLOR[SILVER]; ctx.fillRect(L, 66, 10, 10);
  txt('SILVER  BANK ' + bank + '/' + SILVER_FULL, L + 16, 75, '#eef6ff', 13);
  txt('CARGO ' + cargo, VW - L, 75, cargo ? '#dfe8f2' : '#5d6b78', 12, 'right');
  bar(L, 80, W, 6, (bank + cargo * 0.999) / SILVER_FULL, '#3fae6a');
  // supplemental on one line
  let sx = L;
  for (const t of [COPPER, TIN, IRON]) {
    ctx.fillStyle = ORE_COLOR[t]; ctx.fillRect(sx, 92, 8, 8);
    txt(String(supp[t]), sx + 12, 100, '#cfe3f2', 11);
    sx += 52;
  }
  txt('BAND ' + BAND[0] + '-' + BAND[1], VW - L, 100, '#e8a33d', 11, 'right');

  if (upgradeReady) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(runTime * 6);
    txt('UPGRADE READY — TAP U', cx, VH * 0.30, '#e8a33d', 15, 'center');
    ctx.globalAlpha = 1;
  }
  if (lastCard) txt(lastCard.name + ' x' + has(lastCard.id), cx, VH - 74, '#e8a33d', 12, 'center');
  txt('DRAG TO STEER · TAP TO LAUNCH', cx, VH - 60, '#5d6b78', 11, 'center');

  for (const b of touchButtons()) {
    ctx.fillStyle = 'rgba(10,16,24,0.8)'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#4a7fa8'; ctx.lineWidth = 1; ctx.strokeRect(b.x + .5, b.y + .5, b.w, b.h);
    txt(b.k, b.x + b.w / 2, b.y + 22, '#cfe3f2', b.k.length > 2 ? 11 : 15, 'center');
    txt(b.label, b.x + b.w / 2, b.y + 38, '#8fa9c0', 9, 'center');
  }
  if (msgT > 0) txt(msg, cx, VH * 0.4, '#ffcf5a', 13, 'center', clamp(msgT, 0, 1));
}

function drawUpgradeScreen() {
  ctx.fillStyle = 'rgba(4,7,12,0.82)'; ctx.fillRect(0, 0, VW, VH);
  txt('UPGRADE READY', VW / 2, VH / 2 - 130, '#e8a33d', 26, 'center');
  txt('PICK ONE — CLICK OR PRESS 1 / 2 / 3', VW / 2, VH / 2 - 108, '#8fa9c0', 13, 'center');
  upgradeCards().forEach((c, i) => {
    ctx.fillStyle = '#0b1119'; ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.strokeStyle = '#e8a33d'; ctx.lineWidth = 1; ctx.strokeRect(c.x + .5, c.y + .5, c.w, c.h);
    txt(String(i + 1), c.x + 12, c.y + 26, '#e8a33d', 18);
    txt(c.u.name, c.x + 12, c.y + 56, '#eef6ff', 15);
    // wrap description
    const words = c.u.desc.split(' ');
    let line = '', y = c.y + 82;
    ctx.font = '12px "Courier New",monospace';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > c.w - 24) { txt(line, c.x + 12, y, '#9fb3c6', 12); line = w; y += 16; }
      else line = test;
    }
    txt(line, c.x + 12, y, '#9fb3c6', 12);
    const n = has(c.u.id);
    if (n) txt('OWNED x' + n, c.x + 12, c.y + c.h - 14, '#e8a33d', 11);
  });
}

function drawTitle() {
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, VW, VH);
  const cx = VW / 2, cy = VH / 2;
  txt('DEEPBREAK', cx, cy - 200, '#e8a33d', compact() ? 34 : 44, 'center');
  txt(compact() ? 'BRICK-BREAKING MINING DEMO' : 'A SMALL BRICK-BREAKING ROGUELIKE MINING DEMO',
      cx, cy - 172, '#8fa9c0', compact() ? 12 : 14, 'center');
  const lines = compact() ? [
    'THE HULL CANNOT DIG. THE BALL CAN.',
    '',
    'TAP        LAUNCH / KICK THE BALL',
    'DRAG       FLY THE POD',
    'BUTTONS    RECALL · PING · SLAM',
    '           EXTRACT · UPGRADE',
    '',
    'SILVER SITS BETWEEN ' + BAND[0] + 'M AND ' + BAND[1] + 'M,',
    'BELOW THE EXTRACTOR BEAM LIMIT.',
    'DIG DOWN, FILL THE CARGO,',
    'CLIMB BACK INTO RANGE, EXTRACT.',
    'BANK ' + SILVER_FULL + ' SILVER TO FINISH THE RUN.',
  ] : [
    'THE HULL CANNOT DIG. THE BALL CAN.',
    '',
    'LMB / W    LAUNCH THE BALL — IT BOUNCES AND EATS ROCK',
    '           CLICK AGAIN TO KICK IT IN A NEW DIRECTION',
    'A / D      MOVE      ↑ / SHIFT  THRUST UP      ↓  DIVE',
    'SPACE      RECALL THE BALL     E  PING FOR ORE',
    'R          SLAM — BLASTS A HOLE AROUND YOU (COSTS POWER)',
    'X          EXTRACT CARGO — ONLY ABOVE THE BEAM LIMIT',
    'F          FORCE THE NEXT WAVE EARLY FOR +2 POWER',
    'U          SPEND ORE ON AN UPGRADE WHEN ONE IS READY',
    '',
    'SILVER SITS BETWEEN ' + BAND[0] + 'M AND ' + BAND[1] + 'M — BELOW THE BEAM.',
    'DIG DOWN, FILL THE CARGO, CLIMB BACK INTO RANGE, EXTRACT.',
    'BANK ' + SILVER_FULL + ' SILVER TO FINISH THE RUN.',
  ];
  const fs = compact() ? 12 : 13;
  let y = cy - 130;
  for (const l of lines) { txt(l, cx, y, l.startsWith('THE HULL') ? '#cfe3f2' : '#9fb3c6', fs, 'center'); y += fs + 6; }
  const t = 0.5 + 0.5 * Math.sin(performance.now() / 300);
  txt(compact() ? 'TAP TO DROP IN' : 'PRESS SPACE OR CLICK TO DROP IN', cx, y + 34, '#e8a33d', 16, 'center', 0.4 + 0.6 * t);
}

function drawEnd(won) {
  ctx.fillStyle = 'rgba(4,7,12,0.85)'; ctx.fillRect(0, 0, VW, VH);
  const cx = VW / 2, cy = VH / 2;
  txt(won ? 'EXTRACTION COMPLETE' : 'HULL BREACH', cx, cy - 70, won ? '#49d94f' : '#ff6b6b', 34, 'center');
  const stats = [
    'SILVER BANKED   ' + bank + '/' + SILVER_FULL,
    'MAX DEPTH       ' + maxDepth + 'M',
    'BLOCKS BROKEN   ' + blocksBroken,
    'WAVES SURVIVED  ' + (wave - 1),
    'RUN TIME        ' + Math.floor(runTime / 60) + 'M ' + String(Math.floor(runTime % 60)).padStart(2, '0') + 'S',
  ];
  let y = cy - 24;
  for (const s of stats) { txt(s, cx, y, '#cfe3f2', 14, 'center'); y += 22; }
  txt('PRESS SPACE OR CLICK TO DIVE AGAIN', cx, cy + 110, '#e8a33d', 15, 'center');
}

// ---- loop -----------------------------------------------------------------
let maxDepth = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (state === 'play') {
    update(dt);
    maxDepth = Math.max(maxDepth, podDepth());
  }

  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, VW, VH);
  if (state === 'title') drawTitle();
  else {
    drawWorld();
    drawHUD();
    if (state === 'upgrade') drawUpgradeScreen();
    if (state === 'won' || state === 'lost') drawEnd(state === 'won');
  }
  requestAnimationFrame(frame);
}
generate((Math.random() * 1e9) | 0);
pod.x = (WORLD_W >> 1) * TILE; pod.y = (SURFACE - 1) * TILE;
cam.x = pod.x - VW / 2; cam.y = pod.y - VH / 2;
requestAnimationFrame(frame);

// tiny debug hook (handy for poking at the sim from the console)
window.DEEPBREAK = {
  get state() { return state; },
  get depth() { return podDepth(); },
  get stats() { return { hp: pod.hp, cargo, bank, wave, blocksBroken, power, silverLeft }; },
  start() { resetRun(); state = 'play'; },
  warp(d) { pod.y = (SURFACE + d) * TILE; pod.vy = 0; blastAt(pod.x, pod.y, 3, 9); },
  give(n) { cargo += n; },
  upgrade() { upgradeReady = true; openUpgrades(); },
  tile(tx, ty) { return tileAt(tx, ty); },
  balls() { return balls.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, r: b.returning, life: b.life })); },
  pod() { return { x: pod.x, y: pod.y, vx: pod.vx, vy: pod.vy }; },
};
</script>
